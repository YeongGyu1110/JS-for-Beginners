<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - JFB</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="icon" href="favicon.png" type="image/png">

    <style>
        :root {
            --bg-color: #0c0d0f;
            --surface-color: #13151a;
            --surface-hover: #191c22;
            --text-heading: #f8fafc;
            --text-primary: #cbd5e1;
            --text-secondary: #64748b;
            --accent-color: #ff6b00; 
            --border-color: #22252e;
            --radius-md: 4px;
            --radius-sm: 2px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: var(--bg-color); color: var(--text-primary);
            font-family: 'Pretendard', -apple-system, sans-serif; font-size: 15px; line-height: 1.75;
            -webkit-font-smoothing: antialiased;
            background-image: linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.012) 1px, transparent 1px);
            background-size: 32px 32px; background-attachment: fixed; 
        }

        .header {
            padding: 1rem 2rem; position: sticky; top: 0; z-index: 100;
            background-color: rgba(12, 13, 15, 0.9); backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
        }
        .logo {
            font-family: 'Fira Code', monospace; font-size: 1.15rem; font-weight: 700;
            color: var(--text-heading); text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
            letter-spacing: -0.5px;
        }
        .logo span { color: var(--accent-color); animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* =========================================
           2. 레이아웃
           ========================================= */
        .layout-container {
            display: grid; 
            grid-template-columns: minmax(0, 800px); 
            justify-content: center;
            margin: 4rem auto; 
            padding: 0 2rem; 
            width: 100%;
        }

        /* =========================================
           3. 중앙 검색창 (차분하고 정제된 사이즈)
           ========================================= */
        .hero-search-container {
            margin-bottom: 3.5rem;
            display: flex;
            flex-direction: column;
            align-items: center; /* 폼을 가운데 정렬 */
        }

        .hero-search-form {
            position: relative;
            width: 100%;
            max-width: 600px; /* 검색바 길이를 제어하여 부담감을 줄임 */
            margin-bottom: 1.2rem;
        }

        .hero-search-input {
            width: 100%;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color); /* 2px에서 1px로 줄임 */
            color: var(--text-heading);
            padding: 0.85rem 1.25rem 0.85rem 2.2rem; /* 여백 축소 */
            border-radius: var(--radius-sm);
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem; /* 폰트 크기 확 축소 */
            outline: none;
            transition: all 0.2s ease;
        }

        .hero-search-input::placeholder { 
            color: var(--text-secondary); 
            opacity: 0.5; 
        }

        .hero-search-input:focus { border-color: var(--text-secondary); }

        .hero-search-icon {
            position: absolute; 
            left: 14px; 
            top: 50%; 
            transform: translateY(-50%);
            color: var(--text-secondary); 
            font-size: 0.95rem; 
            font-family: 'Fira Code', monospace; 
            pointer-events: none;
            opacity: 0.5;
            transition: all 0.2s ease;
        }

        /* 기본 상태는 점(·) */
        .hero-search-icon::before { content: "·"; }

        /* [수정됨] 텍스트 입력 여부와 상관없이 오직 ':focus' 상태일 때만 꺾쇠(>) 적용 */
        .hero-search-input:focus ~ .hero-search-icon {
            color: var(--accent-color);
            opacity: 1;
            font-weight: 600;
        }

        .hero-search-input:focus ~ .hero-search-icon::before {
            content: ">";
        }

        /* 추천 태그 */
        .suggested-tags { 
            display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.5rem; 
        }
        .tag {
            font-family: 'Fira Code', monospace; background-color: var(--surface-color); border: 1px solid var(--border-color);
            color: var(--text-secondary); text-decoration: none; padding: 0.25rem 0.5rem; border-radius: var(--radius-sm);
            font-size: 0.75rem; transition: all 0.15s ease; cursor: pointer;
        }
        .tag:hover { border-color: var(--accent-color); color: var(--accent-color); }

        .lab-badge {
            font-family: 'Fira Code', monospace;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 1px 4px;
            border-radius: 2px;
            margin-left: 8px;
            vertical-align: middle;
            letter-spacing: 0.5px;
            background-color: rgba(255, 107, 0, 0.1);
        }

        /* =========================================
           4. 검색 결과 리스트
           ========================================= */
        .search-status {
            font-family: 'Fira Code', monospace; font-size: 0.85rem; color: var(--text-secondary); 
            margin-bottom: 2rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color);
            display: none; 
        }
        .keyword-highlight { color: var(--text-heading); font-weight: 600; }

        .search-result-item {
            padding: 1.5rem; background-color: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: var(--radius-md); margin-bottom: 1.5rem; transition: transform 0.2s, border-color 0.2s;
        }
        .search-result-item:hover { transform: translateY(-2px); border-color: var(--text-secondary); }
        .search-result-title { 
            font-size: 1.2rem; color: var(--text-heading); font-weight: 700; margin-bottom: 0.6rem; 
            text-decoration: none; display: block; letter-spacing: -0.5px;
        }
        .search-result-title:hover { color: var(--accent-color); }
        .search-result-summary { color: var(--text-primary); font-size: 0.95rem; margin-bottom: 1rem; word-break: keep-all; }
        .search-result-meta { display: flex; gap: 0.5rem; }

        .no-results {
            text-align: center; padding: 4rem 0; color: var(--text-secondary); font-family: 'Fira Code', monospace; font-size: 0.85rem;
        }

        /* =========================================
           하단 알림창 (Toast Notification) 스타일
           ========================================= */
        .toast-notification {
            position: fixed;
            bottom: -60px; /* 초기에는 화면 아래에 숨김 */
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--surface-color);
            border: 1px solid var(--accent-color);
            color: var(--text-heading);
            padding: 0.8rem 1.5rem;
            border-radius: var(--radius-sm);
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            z-index: 9999;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); /* 탄력있는 애니메이션 */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }

        .toast-notification::before {
            content: "[!] ";
            color: var(--accent-color);
            font-weight: bold;
        }

        .toast-notification.show {
            bottom: 40px; /* 화면 위로 올라옴 */
            opacity: 1;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
    </style>
</head>
<body>
    
    <header class="header">
        <a href="main.html" class="logo">JFB<span>_</span></a>
    </header>

    <div class="layout-container">
        
        <section class="hero-search-container">
            <!-- 구조 순서: input 먼저, icon 나중 -->
            <form id="search-form" class="hero-search-form">
                <!-- placeholder 값 필수로 입력해두어야 :not(:placeholder-shown) 문법이 정상작동함 -->
                <input type="text" id="hero-search-input" class="hero-search-input" placeholder="Query" autocomplete="off" autofocus>
                <span class="hero-search-icon"></span>
            </form>
            
            <div class="suggested-tags" id="suggested-tags"></div>
        </section>

        <main class="content">
            <div id="search-status" class="search-status">
                Results for "<span id="query-display" class="keyword-highlight"></span>"
            </div>
            <div id="search-results-container"></div>
        </main>
    </div>

    <!-- 푸터 추가 -->
    <footer class="footer" style="border-top: 1px solid var(--border-color); padding: 3rem 2rem; margin-top: auto; font-family: 'Fira Code', monospace; text-align: center; width: 100%;">
        <div style="font-size: 1.1rem; font-weight: 700; color: var(--text-heading); margin-bottom: 0.5rem;">JFB<span style="color: var(--accent-color);">_</span></div>
        <div style="font-size: 0.8rem; color: var(--text-secondary); font-family: 'Pretendard', sans-serif;">자바스크립트 우주를 항해하는 입문자를 위한 컴팩트 가이드.</div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const searchForm = document.getElementById('search-form');
            const searchInput = document.getElementById('hero-search-input');
            const resultsContainer = document.getElementById('search-results-container');
            const searchStatus = document.getElementById('search-status');
            const queryDisplay = document.getElementById('query-display');
            const suggestedTagsContainer = document.getElementById('suggested-tags'); // 동적 렌더링용
            
            let postsDatabase = [];

            // 1. json 파일 비동기 호출 및 추천 태그 동적 생성
            try {
                const res = await fetch('./data/posts.json');
                if(res.ok) {
                    postsDatabase = await res.json();
                    
                    // 모든 포스트에서 태그 추출 및 빈도수 계산
                    const tagCounts = {};
                    postsDatabase.forEach(post => {
                        if (post.tags) {
                            post.tags.forEach(tag => {
                                tagCounts[tag] = (tagCounts[tag] || 0) + 1;
                            });
                        }
                    });

                    // 태그 목록을 배열로 변환 후 무작위 섞기 (Fisher-Yates)
                    const tagArray = Object.keys(tagCounts);
                    for (let i = tagArray.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [tagArray[i], tagArray[j]] = [tagArray[j], tagArray[i]];
                    }

                    // 빈도수 기준으로 정렬 (이미 섞인 상태라 빈도수 같으면 랜덤 순서 유지)
                    tagArray.sort((a, b) => tagCounts[b] - tagCounts[a]);

                    // 상위 4개 추출 및 렌더링
                    const topTags = tagArray.slice(0, 4);
                    if (suggestedTagsContainer) {
                        suggestedTagsContainer.innerHTML = topTags.map(tag => 
                            `<button class="tag" data-tag="#${tag}">#${tag}</button>`
                        ).join('');
                    }
                }
            } catch(e) {
                console.error("데이터베이스를 불러올 수 없습니다.", e);
            }

            // 2. 검색 실행 및 렌더링 함수
            const renderSearch = (query) => {
                if (!query.trim()) {
                    searchStatus.style.display = 'none';
                    resultsContainer.innerHTML = `<div class="no-results">[SYS] 검색어를 입력하고 Enter를 누르세요.</div>`;
                    return;
                }

                searchStatus.style.display = 'block';
                queryDisplay.textContent = query;

                const isTagStrictSearch = query.startsWith('#');
                const lowerQuery = isTagStrictSearch ? query.substring(1).toLowerCase() : query.toLowerCase();

                const filteredResults = postsDatabase.filter(post => {
                    if (isTagStrictSearch) {
                        return post.tags && post.tags.some(tag => tag.toLowerCase().includes(lowerQuery));
                    } else {
                        const inTitle = post.title && post.title.toLowerCase().includes(lowerQuery);
                        const inDesc = post.description && post.description.toLowerCase().includes(lowerQuery);
                        const inTags = post.tags && post.tags.some(tag => tag.toLowerCase().includes(lowerQuery));
                        return inTitle || inDesc || inTags;
                    }
                });

                if (filteredResults.length === 0) {
                    resultsContainer.innerHTML = `<div class="no-results">[SYS] 404_NOT_FOUND: 일치하는 문서를 찾을 수 없습니다.</div>`;
                } else {
                    resultsContainer.innerHTML = filteredResults.map(post => {
                    const targetPage = post.type === 'lab' ? 'lab.html' : 'index.html';
                    const labBadge = post.type === 'lab' ? `<span class="lab-badge">LAB</span>` : '';
                    return `
                        <article class="search-result-item">
                            <a href="${targetPage}?id=${post.id}" class="search-result-title">${post.title}${labBadge}</a>
                            <p class="search-result-summary">${post.description}</p>
                            <div class="search-result-meta">
                                ${post.tags.map(tag => `<button class="tag result-tag" data-tag="#${tag}">#${tag}</button>`).join('')}
                            </div>
                        </article>
                    `;
                }).join('');
                }
            };

            // 3. 초기 세팅 (URL 파라미터 읽기 및 포커스)
            const urlParams = new URLSearchParams(window.location.search);
            const initialQuery = urlParams.get('q') || '';
            
            if (initialQuery) {
                searchInput.value = initialQuery;
                renderSearch(initialQuery);
            } else {
                renderSearch(''); 
            }

            const keepFocus = () => {
                searchInput.focus();
                const val = searchInput.value;
                searchInput.value = '';
                searchInput.value = val;
            };
            keepFocus();

            // ==========================================
            // 4. 이벤트 리스너 바인딩 (이벤트 위임 활용)
            // ==========================================

            // 폼 제출 (엔터)
            const showToast = (message) => {
                let existingToast = document.querySelector('.toast-notification');
                if (existingToast) existingToast.remove();

                const toast = document.createElement('div');
                toast.className = 'toast-notification';
                toast.textContent = message;
                document.body.appendChild(toast);

                setTimeout(() => toast.classList.add('show'), 10);

                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, 2500);
            };

            // 폼 제출 (엔터) 로직 수정
            searchForm.addEventListener('submit', (e) => {
                e.preventDefault(); 
                const query = searchInput.value.trim(); // 좌우 공백 제거

                // 빈 검색어 방지 로직
                if (query === '') {
                    showToast('검색어를 입력해주세요.');
                    searchInput.value = ''; // 스페이스바만 입력한 경우 초기화
                    searchInput.focus();
                    return; // 검색 실행 중단
                }

                renderSearch(query);
                const newUrl = query ? `?q=${encodeURIComponent(query)}` : window.location.pathname;
                window.history.pushState({ path: newUrl }, '', newUrl);
                keepFocus(); 
            });

            // 태그 클릭 통합 관리 (추천 태그 & 결과 태그 모두 처리)
            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('tag') && e.target.hasAttribute('data-tag')) {
                    const tagQuery = e.target.getAttribute('data-tag');
                    searchInput.value = tagQuery;
                    renderSearch(tagQuery);
                    
                    const newUrl = `?q=${encodeURIComponent(tagQuery)}`;
                    window.history.pushState({ path: newUrl }, '', newUrl);
                    
                    // 결과 태그(result-tag)를 클릭한 경우 부드럽게 위로 스크롤
                    if (e.target.classList.contains('result-tag')) {
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                    keepFocus();
                }
            });

            // 브라우저 뒤로가기
            window.addEventListener('popstate', () => {
                const params = new URLSearchParams(window.location.search);
                const q = params.get('q') || '';
                searchInput.value = q;
                renderSearch(q);
            });
        });
    </script>
</body>
</html>
