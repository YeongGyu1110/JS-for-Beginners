<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - My Dark Dev Blog</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0c0d0f;
            --surface-color: #13151a;
            --surface-hover: #191c22;
            --text-heading: #f8fafc;
            --text-primary: #cbd5e1;
            --text-secondary: #64748b;
            --accent-color: #ff6b00; 
            --border-color: #22252e;
            --radius-md: 4px;
            --radius-sm: 2px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        
        body {
            background-color: var(--bg-color); color: var(--text-primary);
            font-family: 'Pretendard', -apple-system, sans-serif; font-size: 15px; line-height: 1.75;
            -webkit-font-smoothing: antialiased;
            background-image: linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.012) 1px, transparent 1px);
            background-size: 32px 32px; background-attachment: fixed; 
        }

        .header {
            padding: 1rem 2rem; position: sticky; top: 0; z-index: 100;
            background-color: rgba(12, 13, 15, 0.9); backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
        }
        .logo {
            font-family: 'Fira Code', monospace; font-size: 1.15rem; font-weight: 700;
            color: var(--text-heading); text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
            letter-spacing: -0.5px;
        }
        .logo span { color: var(--accent-color); animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* =========================================
           2. 레이아웃
           ========================================= */
        .layout-container {
            display: grid; 
            grid-template-columns: minmax(0, 800px); 
            justify-content: center;
            margin: 4rem auto; 
            padding: 0 2rem; 
        }

        /* =========================================
           3. 중앙 검색창 (차분하고 정제된 사이즈)
           ========================================= */
        .hero-search-container {
            margin-bottom: 3.5rem;
            display: flex;
            flex-direction: column;
            align-items: center; /* 폼을 가운데 정렬 */
        }

        .hero-search-form {
            position: relative;
            width: 100%;
            max-width: 600px; /* 검색바 길이를 제어하여 부담감을 줄임 */
            margin-bottom: 1.2rem;
        }

        .hero-search-input {
            width: 100%;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color); /* 2px에서 1px로 줄임 */
            color: var(--text-heading);
            padding: 0.85rem 1.25rem 0.85rem 2.2rem; /* 여백 축소 */
            border-radius: var(--radius-sm);
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem; /* 폰트 크기 확 축소 */
            outline: none;
            transition: all 0.2s ease;
        }

        .hero-search-input::placeholder { 
            color: var(--text-secondary); 
            opacity: 0.5; 
        }

        .hero-search-input:focus { border-color: var(--text-secondary); }

        .hero-search-icon {
            position: absolute; 
            left: 14px; 
            top: 50%; 
            transform: translateY(-50%);
            color: var(--text-secondary); 
            font-size: 0.95rem; 
            font-family: 'Fira Code', monospace; 
            pointer-events: none;
            opacity: 0.5;
            transition: all 0.2s ease;
        }

        /* 기본 상태는 점(·) */
        .hero-search-icon::before { content: "·"; }

        /* [수정됨] 텍스트 입력 여부와 상관없이 오직 ':focus' 상태일 때만 꺾쇠(>) 적용 */
        .hero-search-input:focus ~ .hero-search-icon {
            color: var(--accent-color);
            opacity: 1;
            font-weight: 600;
        }

        .hero-search-input:focus ~ .hero-search-icon::before {
            content: ">";
        }

        /* 추천 태그 */
        .suggested-tags { 
            display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.5rem; 
        }
        .tag {
            font-family: 'Fira Code', monospace; background-color: var(--surface-color); border: 1px solid var(--border-color);
            color: var(--text-secondary); text-decoration: none; padding: 0.25rem 0.5rem; border-radius: var(--radius-sm);
            font-size: 0.75rem; transition: all 0.15s ease; cursor: pointer;
        }
        .tag:hover { border-color: var(--accent-color); color: var(--accent-color); }

        /* =========================================
           4. 검색 결과 리스트
           ========================================= */
        .search-status {
            font-family: 'Fira Code', monospace; font-size: 0.85rem; color: var(--text-secondary); 
            margin-bottom: 2rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color);
            display: none; 
        }
        .keyword-highlight { color: var(--text-heading); font-weight: 600; }

        .search-result-item {
            padding: 1.5rem; background-color: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: var(--radius-md); margin-bottom: 1.5rem; transition: transform 0.2s, border-color 0.2s;
        }
        .search-result-item:hover { transform: translateY(-2px); border-color: var(--text-secondary); }
        .search-result-title { 
            font-size: 1.2rem; color: var(--text-heading); font-weight: 700; margin-bottom: 0.6rem; 
            text-decoration: none; display: block; letter-spacing: -0.5px;
        }
        .search-result-title:hover { color: var(--accent-color); }
        .search-result-summary { color: var(--text-primary); font-size: 0.95rem; margin-bottom: 1rem; word-break: keep-all; }
        .search-result-meta { display: flex; gap: 0.5rem; }

        .no-results {
            text-align: center; padding: 4rem 0; color: var(--text-secondary); font-family: 'Fira Code', monospace; font-size: 0.85rem;
        }
    </style>
</head>
<body>
    
    <header class="header">
        <a href="index.html" class="logo">DEV_LOG<span>_</span></a>
    </header>

    <div class="layout-container">
        
        <section class="hero-search-container">
            <!-- 구조 순서: input 먼저, icon 나중 -->
            <form id="search-form" class="hero-search-form">
                <!-- placeholder 값 필수로 입력해두어야 :not(:placeholder-shown) 문법이 정상작동함 -->
                <input type="text" id="hero-search-input" class="hero-search-input" placeholder="Query" autocomplete="off" autofocus>
                <span class="hero-search-icon"></span>
            </form>
            
            <div class="suggested-tags">
                <button class="tag" data-tag="#markdown">#markdown</button>
                <button class="tag" data-tag="#javascript">#javascript</button>
                <button class="tag" data-tag="#web-design">#web-design</button>
            </div>
        </section>

        <main class="content">
            <div id="search-status" class="search-status">
                Results for "<span id="query-display" class="keyword-highlight"></span>"
            </div>
            <div id="search-results-container"></div>
        </main>
    </div>

    <script>
        const mockDatabase = [
            { id: "post1", title: "마크다운(Markdown) 완벽 가이드", summary: "마크다운의 기본 문법부터 코드 하이라이팅, 테이블 작성 등 심화 문법까지 한 번에 정리합니다.", tags: ["markdown", "web-design"], link: "index.html" },
            { id: "post2", title: "자바스크립트 비동기 처리: async와 await", summary: "Promise의 지옥에서 벗어나 깔끔한 비동기 코드를 작성하는 방법. async/await의 동작 원리를 파헤칩니다.", tags: ["javascript", "async"], link: "index.html" },
            { id: "post3", title: "다크 테마 디자인 시스템 구축하기", summary: "텍스트 가독성을 높이고 눈의 피로를 줄이는 인더스트리얼 테크 감성의 다크 모드 CSS 설계 방법론.", tags: ["web-design", "css"], link: "index.html" }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const searchForm = document.getElementById('search-form');
            const searchInput = document.getElementById('hero-search-input');
            const resultsContainer = document.getElementById('search-results-container');
            const searchStatus = document.getElementById('search-status');
            const queryDisplay = document.getElementById('query-display');

            const renderSearch = (query) => {
                if (!query.trim()) {
                    searchStatus.style.display = 'none';
                    resultsContainer.innerHTML = `<div class="no-results">[SYS] 검색어를 입력하고 Enter를 누르세요.</div>`;
                    return;
                }

                searchStatus.style.display = 'block';
                queryDisplay.textContent = query;

                const isTagStrictSearch = query.startsWith('#'); // 맨 앞에 #이 있는지 확인
                const lowerQuery = isTagStrictSearch ? query.substring(1).toLowerCase() : query.toLowerCase();

                const filteredResults = mockDatabase.filter(post => {
                    if (isTagStrictSearch) {
                        // 1. #으로 시작하면 '태그' 배열에서만 엄격하게 검색
                        return post.tags.some(tag => tag.toLowerCase().includes(lowerQuery));
                    } else {
                        // 2. #이 없으면 '제목 + 요약 + 태그' 전체를 유연하게 검색
                        return post.title.toLowerCase().includes(lowerQuery) || 
                            post.summary.toLowerCase().includes(lowerQuery) || 
                            post.tags.some(tag => tag.toLowerCase().includes(lowerQuery));
                    }
                });                

                if (filteredResults.length === 0) {
                    resultsContainer.innerHTML = `<div class="no-results">[SYS] 404_NOT_FOUND: 일치하는 문서를 찾을 수 없습니다.</div>`;
                } else {
                    resultsContainer.innerHTML = filteredResults.map(post => `
                        <article class="search-result-item">
                            <a href="${post.link}" class="search-result-title">${post.title}</a>
                            <p class="search-result-summary">${post.summary}</p>
                            <div class="search-result-meta">
                                ${post.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}
                            </div>
                        </article>
                    `).join('');
                }
            };

            const urlParams = new URLSearchParams(window.location.search);
            const initialQuery = urlParams.get('q') || '';
            
            if (initialQuery) {
                searchInput.value = initialQuery;
                renderSearch(initialQuery);
            } else {
                renderSearch(''); 
            }

            const keepFocus = () => {
                searchInput.focus();
                const val = searchInput.value;
                searchInput.value = '';
                searchInput.value = val;
            };
            keepFocus();

            searchForm.addEventListener('submit', (e) => {
                e.preventDefault(); 
                const query = searchInput.value;
                renderSearch(query);
                
                const newUrl = query ? `?q=${encodeURIComponent(query)}` : window.location.pathname;
                window.history.pushState({ path: newUrl }, '', newUrl);

                keepFocus(); 
            });

            document.querySelectorAll('.suggested-tags .tag').forEach(btn => {
                btn.addEventListener('click', () => {
                    const tagQuery = btn.getAttribute('data-tag');
                    searchInput.value = tagQuery;
                    renderSearch(tagQuery);
                    
                    const newUrl = `?q=${encodeURIComponent(tagQuery)}`;
                    window.history.pushState({ path: newUrl }, '', newUrl);

                    keepFocus();
                });
            });

            window.addEventListener('popstate', () => {
                const params = new URLSearchParams(window.location.search);
                const q = params.get('q') || '';
                searchInput.value = q;
                renderSearch(q);
            });
        });
    </script>
</body>
</html>
