# 자바스크립트 마크다운 블로그 테스트
이 블로그는 백엔드 없이 작동하며, 작성된 **마크다운**을 실시간으로 변환합니다.

## 인라인 코드 테스트
자바스크립트에서 변수를 선언할 때는 `const`나 `let`을 사용합니다. 
짧은 백틱 하나로 이렇게 예쁘게 표시됩니다!

## 코드 블럭 (백틱 3개) 테스트
아래는 자바스크립트 비동기 처리 예시입니다.

```javascript
async function fetchUserData() {
    try {
        const response = await fetch('https://api.example.com/user');
        const data = await response.json();
        console.log("가져온 데이터:", data);
        return data;
    } catch (error) {
        console.error("에러 발생!", error);
    }
}
```

### 파이썬도 될까요?
물론입니다. 언어 이름을 적어주면 알아서 색칠합니다.

    print(f"Hello, {name}!")
    
say_hello("World")
