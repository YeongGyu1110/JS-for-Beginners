<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dark Dev Blog</title>
    
    <!-- 코드 하이라이팅 테마 (Tomorrow Night) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    
    <!-- 웹 폰트: Pretendard (본문용), Fira Code (코드용) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           1. 테크니컬 다크 테마 변수 (Sharp & Industrial)
           ========================================= */
        :root {
            --bg-color: #0c0d0f;
            --surface-color: #13151a;
            --surface-hover: #191c22;
            
            --text-heading: #f8fafc;
            --text-primary: #cbd5e1;
            --text-secondary: #64748b;
            
            --accent-color: #ff6b00; /* 강렬하고 명확한 인더스트리얼 오렌지 */
            
            --border-color: #22252e;
            --radius-md: 4px; /* 더 단단하고 각진 각도 */
            --radius-sm: 2px;
        }

        /* =========================================
           2. 기본 설정 및 타이포그래피
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            font-size: 15px; /* 약간 촘촘한 글씨가 고밀도 테크니컬 느낌을 줍니다 */
            line-height: 1.75;
            -webkit-font-smoothing: antialiased;

            /* 은은한 기술 설계용 그리드 배경 */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.012) 1px, transparent 1px);
            background-size: 32px 32px;
            background-attachment: fixed; 

            background-attachment: fixed; 
        }

        /* =========================================
           3. UI 컴포넌트 (헤더, 진행률 바)
           ========================================= */
        .progress-container {
            width: 100%;
            height: 2px;
            background: transparent;
            position: fixed;
            top: 0;
            z-index: 1001;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            transition: width 0.1s ease-out;
        }

        .header {
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(12, 13, 15, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-family: 'Fira Code', monospace;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-heading);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .logo span { 
            color: var(--accent-color); 
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* =========================================
           4. 레이아웃
           ========================================= */
        .layout-container {
            display: grid;
            grid-template-columns: 200px minmax(0, 760px) 200px;
            gap: 4rem;
            max-width: 1360px;
            margin: 3rem auto;
            padding: 0 2rem;
            align-items: start;
            justify-content: center;
        }

        .sidebar {
            position: sticky;
            top: 100px;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
        }

        .sidebar::-webkit-scrollbar { width: 0; }

        .sidebar-title {
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* =========================================
           5. 중앙 본문 & 마크다운 스타일
           ========================================= */
        .content {
            padding: 0 0 4rem 0;
        }

        #post-content {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        #post-content.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        .content h1, .content h2, .content h3 {
            color: var(--text-heading);
            font-weight: 700;
            margin-top: 2rem; /* 위쪽 여백을 2rem으로 축소 */
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
            scroll-margin-top: 90px;
        }

        .content h1 { font-size: 2.2rem; margin-top: 1rem; }
        .content h2 { 
            font-size: 1.5rem; 
            padding-bottom: 0.5rem; 
            border-bottom: 1px solid var(--border-color);
        }
        .content h3 { font-size: 1.2rem; }

        .content p {
            margin-bottom: 1.6rem;
            font-size: 0.98rem;
            color: var(--text-primary);
            word-break: keep-all;
        }

        /* 인클로저 상자 형태의 차분한 블록쿼트 */
        .content blockquote {
            margin: 2rem 0;
            padding: 1.2rem 1.5rem;
            background-color: var(--surface-color);
            border-left: 2px solid var(--accent-color);
            border-top: 1px solid rgba(255,255,255,0.02);
            border-right: 1px solid rgba(255,255,255,0.02);
            border-bottom: 1px solid rgba(255,255,255,0.02);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
        }
        
        .content blockquote p { 
            margin-bottom: 0; 
            font-size: 0.95rem;
        }

        /* 테크니컬 리스트 스타일 (사각 포인트) */
        .content ul {
            list-style: none;
            margin-bottom: 1.6rem;
            padding-left: 0;
        }
        .content ul li {
            position: relative;
            padding-left: 1.2rem;
            margin-bottom: 0.5rem;
        }
        .content ul li::before {
            content: "■";
            position: absolute;
            left: 0;
            top: 2px;
            font-size: 0.55rem;
            color: var(--accent-color);
        }

        .content ol {
            margin-bottom: 1.6rem;
            padding-left: 1.2rem;
        }
        .content ol li { 
            margin-bottom: 0.5rem; 
        }

        .content hr {
            border: none;
            height: 1px;
            background-color: var(--border-color);
            margin: 3.5rem 0;
        }

        .content img {
            max-width: 100%;
            height: auto;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            margin: 2.5rem auto;
            display: block;
        }

        /* 군더더기 없는 도표 디자인 */
        .content table {
            width: 100%;
            border-collapse: collapse;
            margin: 2.5rem 0;
            font-size: 0.9rem;
        }
        .content th {
            background-color: var(--surface-color);
            color: var(--text-heading);
            font-weight: 600;
            border-top: 1px solid var(--border-color);
            border-bottom: 2px solid var(--border-color);
            padding: 10px 14px;
            text-align: left;
        }
        .content td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        .content tr:hover {
            background-color: var(--surface-hover);
        }

        /* 인라인 코드: 차분한 다크 배경 회색톤 구성 */
        :not(pre) > code {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-heading);
            padding: 0.2em 0.4em;
            border-radius: var(--radius-sm);
            font-family: 'Fira Code', monospace;
            font-size: 0.88em;
        }

        /* =========================================
           6. 코드 블럭 및 복사 버튼
           ========================================= */
        .content pre {
            background-color: var(--surface-color) !important;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            margin: 2.5rem 0 !important;
            padding: 1.25rem !important;
            max-width: 100%;
            overflow-x: auto;
            position: relative;
        }

        .content pre code {
            font-family: 'Fira Code', monospace !important;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* 미니멀한 모노스페이스 복사 버튼 */
        .copy-button {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            font-size: 0.7rem;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: 'Fira Code', monospace;
        }

        .content pre:hover .copy-button {
            opacity: 1;
            pointer-events: auto;
        }

        .copy-button:hover {
            background-color: var(--surface-hover);
            border-color: var(--text-secondary);
            color: var(--text-heading);
        }

        .copy-button.copied {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: #ffffff;
            font-weight: 500;
        }

        /* 스크롤바 정밀화 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        /* =========================================
           7. 좌우 사이드바 (ToC & 태그)
           ========================================= */
        .toc-container {
            position: relative;
        }

        .toc-container a {
            display: block;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 0.6rem;
            font-size: 0.8rem;
            font-family: 'Fira Code', monospace;
            transition: color 0.15s ease;
            position: relative;
            padding-left: 12px;
        }

        .toc-container a::before {
            content: "·";
            position: absolute;
            left: 0;
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .toc-container a:hover {
            color: var(--text-heading);
        }

        /* 목차 가리키개 가독성 수정 */
        .toc-container a.active {
            color: var(--accent-color);
            font-weight: 500;
        }
        .toc-container a.active::before {
            content: ">";
            color: var(--accent-color);
            opacity: 1;
        }

        .toc-h2 { margin-left: 0; }
        .toc-h3 { margin-left: 10px; font-size: 0.75rem !important; }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .tag {
            font-family: 'Fira Code', monospace;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            text-decoration: none;
            padding: 0.25rem 0.5rem;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            transition: all 0.15s ease;
        }

        .tag:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* =========================================
           8. 반응형 (모바일)
           ========================================= */
        @media (max-width: 1024px) {
            .layout-container {
                grid-template-columns: 1fr;
                gap: 2rem;
                padding: 0 1.5rem;
                margin: 1.5rem auto;
            }
            .sidebar {
                position: static;
                max-height: none;
            }
            .left-sidebar { order: -1; }
            .right-sidebar { order: 2; border-top: 1px solid var(--border-color); padding-top: 2rem; margin-top: 1rem; }
            .header { padding: 1rem 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="progress-container"><div class="progress-bar" id="myBar"></div></div>
    
    <header class="header">
        <div class="logo">DEV_LOG<span>_</span></div>
    </header>

    <div class="layout-container">
        <aside class="sidebar left-sidebar">
            <h3 class="sidebar-title">On this page</h3>
            <nav id="toc" class="toc-container"></nav>
        </aside>

        <main class="content">
            <article id="post-content">
                <div style="font-family: 'Fira Code', monospace; display: flex; justify-content: center; align-items: center; height: 30vh; color: var(--text-secondary); font-size: 0.9rem;">
                    [Loading document...]
                </div>
            </article>
        </main>

        <aside class="sidebar right-sidebar">
            <h3 class="sidebar-title">Tags</h3>
            <div class="tags-container">
                <a href="#" class="tag">#markdown</a>
                <a href="#" class="tag">#javascript</a>
                <a href="#" class="tag">#web-design</a>
            </div>
        </aside>
    </div>

    <!-- 라이브러리 스크립트 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    
    <!-- 커스텀 자바스크립트 -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const contentArea = document.getElementById('post-content');

            try {
                // 1. Markdown 불러오기
                const response = await fetch('./README.md');
                
                if (!response.ok) {
                    throw new Error('마크다운 파일을 불러오는데 실패했습니다.');
                }

                const mdSource = await response.text();

                // 2. 파싱 및 렌더링
                contentArea.innerHTML = marked.parse(mdSource);

                // 3. 코드 하이라이트 적용
                Prism.highlightAll();

                // 4. [추가] 코드 복사(Copy) 기능 동적 추가 적용
                createCopyButtons();

                // 5. 목차(ToC) 생성
                const headings = contentArea.querySelectorAll('h1, h2, h3');
                const tocContainer = document.getElementById('toc');

                headings.forEach((heading, index) => {
                    if (heading.tagName === 'H1') return;

                    if (!heading.id) {
                        heading.id = `heading-${index}`;
                    }

                    const link = document.createElement('a');
                    link.href = `#${heading.id}`;
                    link.textContent = heading.textContent;
                    link.className = `toc-link toc-${heading.tagName.toLowerCase()}`;
                    tocContainer.appendChild(link);
                });

                // 6. 스크롤 스파이 적용
                const tocLinks = document.querySelectorAll('.toc-link');
                const observerOptions = {
                    root: null,
                    rootMargin: "-100px 0px -70% 0px",
                    threshold: 0
                };

                const observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            tocLinks.forEach(link => link.classList.remove('active'));
                            const activeLink = document.querySelector(`.toc-link[href="#${entry.target.id}"]`);
                            if (activeLink) activeLink.classList.add('active');
                        }
                    });
                }, observerOptions);

                headings.forEach(heading => {
                    if (heading.tagName !== 'H1') observer.observe(heading);
                });

                // 7. 로딩 완료 애니메이션 시작
                setTimeout(() => {
                    contentArea.classList.add('loaded');
                }, 100);

            } catch (error) {
                console.error(error);
                contentArea.innerHTML = `<p style="font-family: 'Fira Code', monospace; color: var(--accent-color); padding: 2rem;">[Error: ${error.message}]</p>`;
                contentArea.classList.add('loaded');
            }

            // 8. 진행률 바
            window.addEventListener('scroll', () => {
                const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
                const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                const scrolled = (winScroll / height) * 100;
                document.getElementById("myBar").style.width = scrolled + "%";
            });
        });

        // [추가] 복사 버튼 생성 및 이벤트 부여 함수
        function createCopyButtons() {
            const preElements = document.querySelectorAll('.content pre');

            preElements.forEach((pre) => {
                if (pre.querySelector('.copy-button')) return;

                const button = document.createElement('button');
                button.className = 'copy-button';
                
                // 미니멀 SVG 복사 모양 아이콘
                button.innerHTML = `
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="1" ry="1"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    <span>COPY</span>
                `;

                pre.appendChild(button);

                button.addEventListener('click', async () => {
                    const codeElement = pre.querySelector('code');
                    if (!codeElement) return;

                    try {
                        await navigator.clipboard.writeText(codeElement.innerText);

                        button.classList.add('copied');
                        button.innerHTML = `
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                            <span>DONE</span>
                        `;

                        setTimeout(() => {
                            button.classList.remove('copied');
                            button.innerHTML = `
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="9" y="9" width="13" height="13" rx="1" ry="1"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                                <span>COPY</span>
                            `;
                        }, 1500);

                    } catch (err) {
                        console.error('복사에 실패했습니다.', err);
                        button.innerText = 'ERR';
                    }
                });
            });
        }
    </script>
</body>
</html>
