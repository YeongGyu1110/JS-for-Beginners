<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JFB</title>
    
    <!-- 코드 하이라이팅 테마 (Tomorrow Night) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    
    <!-- 웹 폰트: Pretendard (본문용), Fira Code (코드용) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="icon" href="favicon.png" type="image/png">

    <link rel="stylesheet" href="./common/common.css">
    <link rel="stylesheet" href="./common/markdown.css">

    <style>

        .layout-container {
            display: grid;
            grid-template-columns: 200px minmax(0, 760px) 200px;
            gap: 4rem;
            max-width: 1360px;
            margin: 3rem auto;
            padding: 0 2rem;
            align-items: start;
            justify-content: center;
        }

        .sidebar {
            position: sticky;
            top: 100px;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
        }

        .sidebar::-webkit-scrollbar { width: 0; }

        .sidebar-title {
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        /* =========================================
           7. 좌우 사이드바 (ToC & 태그)
           ========================================= */
        .toc-container {
            position: relative;
        }

        .toc-container a {
            display: block;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 0.6rem;
            font-size: 0.8rem;
            font-family: 'Fira Code', monospace;
            transition: color 0.15s ease;
            position: relative;
            padding-left: 12px;
        }

        .toc-container a::before {
            content: "·";
            position: absolute;
            left: 0;
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .toc-container a:hover {
            color: var(--text-heading);
        }

        /* 목차 가리키개 가독성 수정 */
        .toc-container a.active {
            color: var(--accent-color);
            font-weight: 500;
        }
        .toc-container a.active::before {
            content: ">";
            color: var(--accent-color);
            opacity: 1;
        }

        .toc-h2 { margin-left: 0; }
        .toc-h3 { margin-left: 10px; font-size: 0.75rem !important; }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        /* =========================================
           8. 반응형 (모바일)
           ========================================= */
        @media (max-width: 1024px) {
            .layout-container {
                grid-template-columns: 1fr;
                gap: 2rem;
                padding: 0 1.5rem;
                margin: 1.5rem auto;
            }
            .sidebar {
                position: static;
                max-height: none;
            }
            .left-sidebar { order: -1; }
            .right-sidebar { order: 2; border-top: 1px solid var(--border-color); padding-top: 2rem; margin-top: 1rem; }
            .header { padding: 1rem 1.5rem; }
        }

        /* =========================================
        9. 검색창 스타일 (Sidebar Search)
        ========================================= */
        .search-form {
            margin-bottom: 2.5rem;
            position: relative;
        }

        /* =========================================
           11. 우측 챕터 리스트 (Left ToC와 대칭 디자인)
           ========================================= */
        .sidebar-title-link {
            text-decoration: none;
            display: inline-block;
            margin-top: 2rem;
            margin-bottom: 1.2rem;
            transition: opacity 0.2s ease;
        }

        .sidebar-title-link:hover {
            opacity: 0.7;
        }

        .sidebar-title-link .sidebar-title {
            margin-bottom: 0; /* 링크 내부이므로 하단 여백 제거 */
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s ease;
        }

        .sidebar-title-link:hover .sidebar-title {
            color: var(--accent-color);
        }

        /* [ 1/5 ] 같은 카운터 뱃지 */
        .chapter-count {
            color: var(--text-secondary);
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0;
        }

        .right-toc-container {
            position: relative;
            display: flex;
            flex-direction: column;
            margin-bottom: 2.5rem;
        }

        .right-toc-container a {
            display: block;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 0.6rem;
            font-size: 0.8rem;
            font-family: 'Fira Code', monospace;
            transition: color 0.15s ease;
            position: relative;
            padding-left: 14px;
            
            /* 너비가 좁을 때 텍스트가 줄바꿈되지 않고 '...'으로 처리되게 함 */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 기본 마커: 점(·) */
        .right-toc-container a::before {
            content: "·";
            position: absolute;
            left: 0;
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .right-toc-container a:hover {
            color: var(--text-heading);
        }

        /* 현재 읽고 있는 문서 액티브 효과 */
        .right-toc-container a.active {
            color: var(--accent-color);
            font-weight: 500;
        }
        
        /* 액티브 마커: 꺾쇠(>) */
        .right-toc-container a.active::before {
            content: ">";
            color: var(--accent-color);
            opacity: 1;
        }

        @media (max-width: 1200px) {
            .side-nav-btn { display: none; } /* 화면이 좁으면 본문 버튼만 노출 */
        }

        @media (max-width: 600px) {
            .post-navigation { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="progress-container"><div class="progress-bar" id="myBar"></div></div>
    
    <header class="header">
        <a href="main.html" class="logo" style="text-decoration: none;">JFB<span>_</span></a>
    </header>

    <div class="layout-container">
        <aside class="sidebar left-sidebar">

            <form action="search.html" method="GET" class="search-form">
                <!-- input을 먼저 배치해야 CSS 형제 선택자(~)로 아이콘을 제어할 수 있습니다 -->
                <input type="text" name="q" class="search-input" placeholder="Search..." autocomplete="off">
                <span class="search-icon"></span>
            </form>

            <h3 class="sidebar-title">On this page</h3>
            <nav id="toc" class="toc-container"></nav>
        </aside>

        <main class="content">
            <article id="post-content" class="markdown-body">
                <div style="font-family: 'Fira Code', monospace; display: flex; justify-content: center; align-items: center; height: 30vh; color: var(--text-secondary); font-size: 0.9rem;">
                    [Loading document...]
                </div>
            </article>
        </main>

        <aside class="sidebar right-sidebar">
            
            <!-- 챕터 제목 (클릭 시 chapter.html로 이동) -->
            <a href="#" id="side-chapter-title-link" class="sidebar-title-link" title="해당 챕터 전체 보기">
                <h3 class="sidebar-title">
                    <span id="side-chapter-title">Chapter</span> 
                    <span class="chapter-count" id="side-chapter-count">[0/0]</span>
                </h3>
            </a>
            
            <!-- 네비게이션 리스트 -->
            <nav id="chapter-nav" class="right-toc-container"></nav>
            
            <!-- 태그 영역 -->
            <h3 class="sidebar-title">Tags</h3>
            <div class="tags-container" id="tags-container">
                <!-- JS에서 동적으로 렌더링됩니다 -->
            </div>
            
        </aside>
    </div>

    <!-- 라이브러리 스크립트 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-footnote/dist/index.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
        
    <script src="./common/common.js"></script>
    <script src="./common/doc.js"></script>

    <!-- 커스텀 자바스크립트 -->
    <!-- 커스텀 자바스크립트 -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const contentArea = document.getElementById('post-content');
            const tagsContainer = document.querySelector('.right-sidebar .tags-container');
            const searchForm = document.querySelector('.search-form');
            const searchInput = document.querySelector('.search-input');

            // 1. 공통 유틸리티 초기화
            initProgressBar();
            DocCore.initMarked(); // 마크다운 렌더러 설정

            if (searchForm && searchInput) {
                searchForm.addEventListener('submit', (e) => {
                    if (searchInput.value.trim() === '') {
                        e.preventDefault();
                        showToast('검색어를 입력해주세요.');
                    }
                });
            }

            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');

            // 파라미터가 없으면 빈 화면 출력
            if (!postId) return DocCore.renderSystemMessage('empty', contentArea, tagsContainer);

            try {
                // 2. 데이터 로드
                const [postsResponse, chaptersResponse] = await Promise.all([
                    fetch('./data/posts.json'),
                    fetch('./data/chapters.json')
                ]);

                if (!postsResponse.ok || !chaptersResponse.ok) throw new Error('DB_LOAD_FAIL');
                
                const posts = await postsResponse.json();
                const chapters = await chaptersResponse.json();
                const currentPost = posts.find(p => p.id === postId);
                
                // 데이터 검증 및 에러 처리
                if (!currentPost) return DocCore.renderSystemMessage('404', contentArea, tagsContainer);
                if (currentPost.type === 'lab') return DocCore.renderSystemMessage('wrong_type', contentArea, tagsContainer, postId);
                if (!currentPost.path.startsWith('./script/')) throw new Error('INVALID_PATH');

                // 3. UI 업데이트 (사이드바, 태그, 제목)
                document.title = currentPost.title + " - JFB";
                
                if (currentPost.tags && currentPost.tags.length > 0) {
                    tagsContainer.innerHTML = currentPost.tags.map(tag => `<a href="search.html?q=%23${tag}" class="tag">#${tag}</a>`).join('');
                }

                const chapterPosts = posts.filter(p => p.chapter === currentPost.chapter).sort((a, b) => a.order - b.order);
                const chapterInfo = chapters[currentPost.chapter];
                
                if (chapterInfo) {
                    document.getElementById('side-chapter-title').textContent = chapterInfo.title;
                    document.getElementById('side-chapter-title-link').href = `chapter.html?id=${currentPost.chapter}`;
                }
                
                document.getElementById('chapter-nav').innerHTML = chapterPosts.map((p, idx) => {
                    const num = String(idx + 1).padStart(2, '0');
                    const targetPage = p.type === 'lab' ? 'lab.html' : 'index.html';
                    return `<a href="${targetPage}?id=${p.id}" class="${p.id === postId ? 'active' : ''}" title="${num}. ${p.title}">${num}. ${p.title}</a>`;
                }).join('');

                const countBadge = document.getElementById('side-chapter-count');
                if(countBadge) countBadge.textContent = `[${chapterPosts.findIndex(p => p.id === postId) + 1}/${chapterPosts.length}]`;

                // 4. 마크다운 파일 렌더링
                const mdResponse = await fetch(currentPost.path);
                if (!mdResponse.ok) throw new Error('MD_LOAD_FAIL');

                contentArea.innerHTML = marked.parse(await mdResponse.text());

                // 5. 부가 기능 초기화 (하이라이팅, 복사, 목차, 네비게이션)
                Prism.highlightAll();
                DocCore.createCopyButtons(contentArea);
                DocCore.buildToC(contentArea, 'toc');
                DocCore.buildNavigation(postId, posts, contentArea);

                setTimeout(() => contentArea.classList.add('loaded'), 100);

            } catch (error) {
                console.error(error);
                DocCore.renderSystemMessage('404', contentArea, tagsContainer); 
            }
        });
    </script>
</body>
</html>
