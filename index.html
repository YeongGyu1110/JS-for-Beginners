<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dark Dev Blog</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="progress-container"><div class="progress-bar" id="myBar"></div></div>
    <header class="header"><div class="logo">DevLog_</div></header>

    <div class="layout-container">
        <!-- 좌측: 자동 목차 -->
        <aside class="sidebar left-sidebar">
            <h3 class="sidebar-title">목차</h3>
            <nav id="toc" class="toc-container"></nav>
        </aside>

        <!-- 중앙: 블로그 본문 -->
        <main class="content">
            <!-- 자바스크립트가 readme.md를 가져와서 여기에 쏙 넣어줍니다 -->
            <article id="post-content">
                <p style="text-align: center; color: var(--text-secondary);">글을 불러오는 중입니다...</p>
            </article>
        </main>

        <!-- 우측: 키워드 -->
        <aside class="sidebar right-sidebar">
            <h3 class="sidebar-title">키워드</h3>
            <div class="tags-container">
                <a href="#" class="tag">#Markdown</a>
                <a href="#" class="tag">#JavaScript</a>
            </div>
        </aside>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
