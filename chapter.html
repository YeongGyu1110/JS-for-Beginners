<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter Preview - JFB</title>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="icon" href="favicon.png" type="image/png">

    <link rel="stylesheet" href="./common/common.css">

    <style>
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Pretendard', sans-serif;
            font-size: 15px;
            line-height: 1.75;
            -webkit-font-smoothing: antialiased;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.012) 1px, transparent 1px);
            background-size: 32px 32px;
            background-attachment: fixed;
        }
        /* =========================================
           3. 챕터 히어로 섹션
           ========================================= */
        .chapter-hero {
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(180deg, rgba(255,107,0,0.03) 0%, transparent 100%);
            padding: 5rem 2rem 4rem 2rem;
        }

        .hero-content-wrapper {
            max-width: 900px;
            margin: 0 auto;
        }

        .chapter-meta-badge {
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            color: var(--accent-color);
            display: inline-block;
            margin-bottom: 1rem;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 107, 0, 0.3);
            padding: 0.2rem 0.6rem;
            border-radius: var(--radius-sm);
            background-color: rgba(255, 107, 0, 0.05);
        }

        .chapter-title {
            font-family: 'Fira Code', monospace;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-heading);
            margin-bottom: 1.5rem;
            letter-spacing: -1px;
            line-height: 1.2;
            min-height: 3rem;
        }

        .chapter-desc {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.7;
            max-width: 700px;
            margin-bottom: 2.5rem;
            word-break: keep-all;
        }

        .hero-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .start-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.8rem 1.8rem;
            background-color: var(--surface-color);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: var(--radius-sm);
            transition: all 0.2s ease;
        }

        .start-btn:hover {
            background-color: var(--accent-color);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 0, 0.2);
        }
        .start-btn svg { width: 16px; height: 16px; }

        .chapter-stats {
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .chapter-stats span { color: var(--text-primary); font-weight: 600; }

        /* =========================================
           4. 커리큘럼 모듈 리스트 (문서 목록)
           ========================================= */
        .curriculum-section {
            max-width: 900px;
            margin: 4rem auto;
            padding: 0 2rem;
        }

        .section-heading {
            font-family: 'Fira Code', monospace;
            font-size: 1.2rem;
            color: var(--text-heading);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-heading::before { content: "■"; color: var(--accent-color); font-size: 0.6rem; }

        .module-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* 
          전체 클릭(a태그)을 해제하고 div로 변경하여 태그 클릭 시 꼬임 방지
        */
        .module-card {
            display: flex;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 2rem;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .module-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background-color: transparent;
            transition: background-color 0.2s ease;
        }

        .module-card:hover {
            border-color: var(--text-secondary);
            background-color: var(--surface-hover);
        }

        .module-card:hover::before {
            background-color: var(--accent-color);
        }

        .module-number {
            font-family: 'Fira Code', monospace;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--border-color);
            margin-right: 2rem;
            line-height: 1;
            transition: color 0.2s ease;
            user-select: none;
        }

        /* 호버 시 번호 색상을 뚜렷하게 변경 */
        .module-card:hover .module-number { 
            color: rgba(255, 107, 0, 0.7); 
        }

        .module-content { flex: 1; }

        /* 타이틀을 a 태그로 변경 및 호버 이펙트 추가 */
        .module-title {
            display: inline-block;
            font-size: 1.25rem;
            color: var(--text-heading);
            font-weight: 700;
            margin-bottom: 0.6rem;
            letter-spacing: -0.5px;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .module-title:hover {
            color: var(--accent-color);
        }

        .module-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 1.2rem;
            line-height: 1.6;
            word-break: keep-all;
        }

        .module-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .chapter-hero { padding: 3rem 1.5rem; }
            .chapter-title { font-size: 2rem; }
            .module-card { flex-direction: column; padding: 1.5rem; }
            .module-number { margin-right: 0; margin-bottom: 1rem; font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="main.html" class="logo">JFB<span>_</span></a>
    </header>

    <div id="app-container">
        <div class="system-message-container">
            <span style="font-family: 'Fira Code', monospace; color: var(--text-secondary);">[INITIALIZING_MODULE...]</span>
        </div>
    </div>

    <!-- 푸터 -->
    <footer class="footer" style="border-top: 1px solid var(--border-color); padding: 3rem 2rem; margin-top: 3rem; font-family: 'Fira Code', monospace; text-align: center;">
        <div style="font-size: 1.1rem; font-weight: 700; color: var(--text-heading); margin-bottom: 0.5rem;">JFB<span style="color: var(--accent-color);">_</span></div>
        <div style="font-size: 0.8rem; color: var(--text-secondary); font-family: 'Pretendard', sans-serif;">자바스크립트 우주를 항해하는 입문자를 위한 컴팩트 가이드.</div>
    </footer>

    <script>
        class TextScrambler {
            constructor(el) {
                this.el = el;
                this.chars = '!<>-_\\/[]{}—=+*^?#@&%0123456789';
                this.update = this.update.bind(this);
            }
            setText(newText) {
                const oldText = this.el.innerText;
                const length = Math.max(oldText.length, newText.length);
                const promise = new Promise((resolve) => (this.resolve = resolve));
                this.queue = [];
                for (let i = 0; i < length; i++) {
                    const from = oldText[i] || '';
                    const to = newText[i] || '';
                    const start = Math.floor(Math.random() * 40);
                    const end = start + Math.floor(Math.random() * 40);
                    this.queue.push({ from, to, start, end });
                }
                cancelAnimationFrame(this.frameRequest);
                this.frame = 0;
                this.update();
                return promise;
            }
            update() {
                let output = '';
                let complete = 0;
                for (let i = 0, n = this.queue.length; i < n; i++) {
                    let { from, to, start, end, char } = this.queue[i];
                    if (this.frame >= end) {
                        complete++;
                        output += to;
                    } else if (this.frame >= start) {
                        if (!char || Math.random() < 0.28) {
                            char = this.chars[Math.floor(Math.random() * this.chars.length)];
                            this.queue[i].char = char;
                        }
                        output += `<span style="color: var(--accent-color)">${char}</span>`;
                    } else {
                        output += from;
                    }
                }
                this.el.innerHTML = output;
                if (complete === this.queue.length) {
                    this.resolve();
                } else {
                    this.frameRequest = requestAnimationFrame(this.update);
                    this.frame++;
                }
            }
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const container = document.getElementById('app-container');
            const urlParams = new URLSearchParams(window.location.search);
            const chapterId = urlParams.get('id');

            const renderEmptyState = () => {
                document.title = "Chapter Preview - JFB";
                container.innerHTML = `
                    <div class="system-message-container">
                        <svg class="system-message-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        </svg>
                        <h2 class="system-message-subtitle" style="font-size: 1.2rem;">NO_CHAPTER_SELECTED</h2>
                        <p class="system-message-desc" style="opacity: 0.7; margin-bottom: 2.5rem;">조회할 챕터를 선택해주세요.</p>
                        <a href="main.html" class="return-home-btn">> GO_TO_CURRICULUM_</a>
                    </div>
                `;
            };

            const renderError = () => {
                document.title = "404 - JFB";
                container.innerHTML = `
                    <div class="system-message-container">
                        <svg class="system-message-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <h1 class="system-message-title">404</h1>
                        <h2 class="system-message-subtitle">CHAPTER_NOT_FOUND</h2>
                        <p class="system-message-desc">요청하신 챕터를 찾을 수 없거나 데이터베이스에 존재하지 않습니다.</p>
                        <a href="main.html" class="return-home-btn">> RETURN_TO_MAIN_</a>
                    </div>
                `;
            };

            if (!chapterId) return renderEmptyState();

            try {
                // 데이터 병렬 로드
                const [postsRes, chaptersRes] = await Promise.all([
                    fetch('./data/posts.json'),
                    fetch('./data/chapters.json').catch(() => ({ ok: false }))
                ]);

                if (!postsRes.ok) throw new Error("Data Load Failed");
                
                const posts = await postsRes.json();
                let chaptersData = {};
                if (chaptersRes.ok) chaptersData = await chaptersRes.json();

                // 해당 챕터의 문서 필터링
                const chapterPosts = posts.filter(p => p.chapter === chapterId).sort((a, b) => a.order - b.order);

                if (chapterPosts.length === 0) return renderError();

                // 챕터 메타 정보 (JSON에 description이 없으면 기본 문구 출력)
                const info = chaptersData[chapterId] || {
                    meta: `SECTION 0${chapterId}`,
                    title: `Chapter ${chapterId}`,
                };
                
                const fallbackDescription = "이 챕터의 상세 설명이 아직 등록되지 않았습니다. 하단의 학습 모듈을 통해 속해있는 문서를 직접 확인하고 학습을 시작하세요.";
                const finalDesc = info.description || fallbackDescription;

                document.title = `${info.title} - JFB`;
                const firstPost = chapterPosts[0];
                const firstPostTarget = firstPost.type === 'lab' ? 'lab.html' : 'index.html';

                // 모듈 카드 HTML 생성 (카드는 div, 타이틀과 태그는 a 태그)
                const modulesHTML = chapterPosts.map((post, index) => {
                    const targetPage = post.type === 'lab' ? 'lab.html' : 'index.html';
                    const labBadge = post.type === 'lab' ? `<span class="lab-badge">LAB</span>` : '';
                    return `
                    <div class="module-card">
                        <div class="module-number">${String(index + 1).padStart(2, '0')}</div>
                        <div class="module-content">
                            <a href="${targetPage}?id=${post.id}" class="module-title">${post.title}${labBadge}</a>
                            <p class="module-desc">${post.description || '상세 설명이 제공되지 않은 문서입니다.'}</p>
                            <div class="module-tags">
                                ${(post.tags || []).map(tag => 
                                    `<a href="search.html?q=%23${tag}" class="tag">#${tag}</a>`
                                ).join('')}
                            </div>
                        </div>
                    </div>
                `}).join('');

                container.innerHTML = `
                    <section class="chapter-hero">
                        <div class="hero-content-wrapper">
                            <span class="chapter-meta-badge">${info.meta}</span>
                            <h1 class="chapter-title" id="hero-title"></h1>
                            <p class="chapter-desc">${finalDesc}</p>
                            
                            <div class="hero-actions">
                                <a href="${firstPostTarget}?id=${firstPost.id}" class="start-btn">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                                    </svg>
                                    START_CHAPTER_
                                </a>
                                <div class="chapter-stats">
                                    [ TOTAL_MODULES: <span>${chapterPosts.length}</span> ]
                                </div>
                            </div>
                        </div>
                    </section>

                    <section class="curriculum-section">
                        <h2 class="section-heading">LEARNING_PATH_</h2>
                        <div class="module-list">
                            ${modulesHTML}
                        </div>
                    </section>
                `;

                // 타이틀 스크램블 애니메이션
                setTimeout(() => {
                    const titleEl = document.getElementById('hero-title');
                    if(titleEl) {
                        const fx = new TextScrambler(titleEl);
                        fx.setText(info.title);
                    }
                }, 100);

            } catch (error) {
                console.error(error);
                renderError();
            }
        });
    </script>
</body>
</html>
