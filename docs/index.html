<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JFB</title>
    
    <!-- 코드 하이라이팅 테마 (Tomorrow Night) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    
    <!-- 웹 폰트: Pretendard (본문용), Fira Code (코드용) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="icon" href="../favicon.png" type="image/png">

    <link rel="stylesheet" href="../assets/common/common.css">
    <link rel="stylesheet" href="../assets/viewer/markdown.css">

    <style>

        .layout-container {
            display: grid;
            grid-template-columns: 200px minmax(0, 760px) 200px;
            gap: 4rem;
            max-width: 1360px;
            margin: 3rem auto;
            padding: 0 2rem;
            align-items: start;
            justify-content: center;
        }

        .sidebar {
            position: sticky;
            top: 100px;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
        }

        .sidebar::-webkit-scrollbar { width: 0; }

        .sidebar-title {
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        /* =========================================
           7. 좌우 사이드바 (ToC & 태그)
           ========================================= */
        .toc-container {
            position: relative;
        }

        .toc-container a {
            display: block;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 0.6rem;
            font-size: 0.8rem;
            font-family: 'Fira Code', monospace;
            transition: color 0.15s ease;
            position: relative;
            padding-left: 12px;
        }

        .toc-container a::before {
            content: "·" / "";
            position: absolute;
            left: 0;
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .toc-container a:hover {
            color: var(--text-heading);
        }

        /* 목차 가리키개 가독성 수정 */
        .toc-container a.active {
            color: var(--accent-color);
            font-weight: 500;
        }
        .toc-container a.active::before {
            content: ">" / "";
            color: var(--accent-color);
            opacity: 1;
        }

        .toc-h2 { margin-left: 0; }
        .toc-h3 { margin-left: 10px; font-size: 0.75rem !important; }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        /* =========================================
        9. 검색창 스타일 (Sidebar Search)
        ========================================= */
        .search-form {
            margin-bottom: 2.5rem;
            position: relative;
        }

        /* =========================================
           11. 우측 챕터 리스트 (Left ToC와 대칭 디자인)
           ========================================= */
        .sidebar-title-link {
            text-decoration: none;
            display: inline-block;
            margin-top: 2rem;
            margin-bottom: 1.2rem;
            transition: opacity 0.2s ease;
        }

        .sidebar-title-link:hover {
            opacity: 0.7;
        }

        .sidebar-title-link .sidebar-title {
            margin-bottom: 0; /* 링크 내부이므로 하단 여백 제거 */
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s ease;
        }

        .sidebar-title-link:hover .sidebar-title {
            color: var(--accent-color);
        }

        /* [ 1/5 ] 같은 카운터 뱃지 */
        .chapter-count {
            color: var(--text-secondary);
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0;
        }

        .right-toc-container {
            position: relative;
            display: flex;
            flex-direction: column;
            margin-bottom: 2.5rem;
        }

        .right-toc-container a {
            display: block;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 0.6rem;
            font-size: 0.8rem;
            font-family: 'Fira Code', monospace;
            transition: color 0.15s ease;
            position: relative;
            padding-left: 14px;
            
            /* 너비가 좁을 때 텍스트가 줄바꿈되지 않고 '...'으로 처리되게 함 */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 기본 마커: 점(·) */
        .right-toc-container a::before {
            content: "·" / "";
            position: absolute;
            left: 0;
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .right-toc-container a:hover {
            color: var(--text-heading);
        }

        /* 현재 읽고 있는 문서 액티브 효과 */
        .right-toc-container a.active {
            color: var(--accent-color);
            font-weight: 500;
        }
        
        /* 액티브 마커: 꺾쇠(>) */
        .right-toc-container a.active::before {
            content: ">" / "";
            color: var(--accent-color);
            opacity: 1;
        }

        /* =========================================
           [추가] 모바일 UX 대응 (Bottom Sheet & Layout)
           ========================================= */

        .content, .right-sidebar { min-width: 0; max-width: 100vw; }
        .markdown-body { overflow-wrap: break-word; word-break: break-word; }

        /* --- 데스크탑에서는 모바일 UI 숨김 --- */
        .mobile-bottom-bar, .sheet-overlay { display: none; }

        @media (max-width: 1024px) {
            .layout-container {
                grid-template-columns: 1fr;
                gap: 2rem;
                padding: 0 1.5rem;
                /* 플로팅 바가 글 끝부분을 가리지 않도록 하단 여백을 더 넉넉히 확보 */
                padding-bottom: 120px; 
            }

            .right-sidebar {
                order: 2;
                position: static;
                border-top: 1px solid var(--border-color);
                padding-top: 2rem;
                margin-top: 2rem;
            }

            .left-sidebar {
                position: fixed;
                top: auto; 
                bottom: 0;
                left: 0;
                width: 100%;
                background-color: var(--surface-color);
                /* border-top: 1px solid var(--accent-color); */
                border-top: 1px solid var(--border-color);
                
                /* [수정] 둥근 곡선(16px)을 삭제하고 테두리를 직각(0)으로 변경하여 디자인 일관성 확보 */
                border-radius: 0; 
                
                padding: 2rem;
                padding-bottom: 100px;
                z-index: 2000;
                transform: translateY(100%); 
                visibility: hidden; 
                transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), visibility 0.3s;
                box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
                max-height: 75vh; 
                overflow-y: auto;
            }
            .left-sidebar.sheet-open {
                transform: translateY(0);
                visibility: visible;
            }

            .sheet-overlay {
                display: block;
                position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                background-color: rgba(12, 13, 15, 0.85); 
                backdrop-filter: blur(4px);
                -webkit-backdrop-filter: blur(4px);
                z-index: 1999;
                opacity: 0; pointer-events: none;
                transition: opacity 0.3s ease;
            }
            .sheet-overlay.show { opacity: 1; pointer-events: auto; }

            /* --- 하단 플로팅 탭 바 (Floating Design) --- */
            .mobile-bottom-bar {
                display: flex;
                position: fixed;
                bottom: 25px; 
                left: 50%;
                transform: translateX(-50%);
                
                /* [수정] 가로폭을 넓히고 최대 너비 제한 (가로로 긴 바 형태) */
                width: calc(100% - 3rem);
                max-width: 400px; 
                
                /* background-color: rgba(19, 21, 26, 0.85);  */
                background-color: rgba(19, 21, 26, 1); 
                /* backdrop-filter: blur(8px); */
                /* -webkit-backdrop-filter: blur(8px); */
                /* border: 1px solid var(--accent-color); */
                border: 1px solid var(--border-color);
                border-radius: var(--radius-sm); /* 다른 입력창과 동일한 2px의 미세한 각 처리 */
                /* box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); */
                box-shadow: 0 10px 30px rgba(0, 0, 0, 1);
                z-index: 2001; 
                transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.3s ease;
            }

            /* 스크롤 다운 시 화면 아래로 숨기기 위한 클래스 */
            .mobile-bottom-bar.hide {
                transform: translate(-50%, 150px);
                opacity: 0;
                pointer-events: none;
            }

            .bottom-tab-btn {
                flex: 1; /* [수정] 두 버튼이 50:50으로 정확히 공간을 나눠가짐 */
                display: flex; 
                align-items: center; 
                justify-content: center;
                background: transparent; 
                border: none;
                color: var(--text-secondary);
                
                /* [수정] 위아래 패딩을 줄여서 바의 높이를 얇게 조정 */
                padding: 0.8rem 0; 
                
                cursor: pointer;
                transition: all 0.2s ease;
                
                /* 텍스트 폰트 설정 (아이콘 제거) */
                font-family: 'Fira Code', monospace;
                font-size: 0.8rem;
                font-weight: 600;
                letter-spacing: 1px;
            }

            .bottom-tab-btn.active, .bottom-tab-btn:active {
                color: var(--accent-color);
                background-color: rgba(255, 107, 0, 0.05); /* 터치 시 미세한 배경 하이라이트 */
            }

            .sheet-item-hidden { display: none !important; }
        }

        @media (max-width: 480px) {
            body, html { overflow-x: hidden; }
            .layout-container { padding: 0 1rem; padding-bottom: 80px; }
            .header { padding: 1rem; }
            .search-input { font-size: 16px; } /* iOS 자동 확대 방지 */
            .markdown-body pre { margin: 2rem -1rem !important; padding: 1rem !important; border-radius: 0; border-left: none; border-right: none; }
        }
    </style>
</head>
<body>
    <div class="progress-container"><div class="progress-bar" id="myBar"></div></div>
    
    <header class="header">
        <a href="../" class="logo" style="text-decoration: none;">JFB<span aria-hidden="true">_</span></a>
    </header>

    <div class="layout-container">
        <aside class="sidebar left-sidebar">

            <form action="../search/" method="GET" class="search-form" role="search">
                <input type="text" name="q" class="search-input" placeholder="Search..." autocomplete="off" aria-label="문서 검색">
                <span class="search-icon" aria-hidden="true"></span>
            </form>

            <h3 class="sidebar-title" aria-hidden="true">On this page</h3>
            <nav id="toc" class="toc-container" aria-label="현재 문서 목차"></nav>
        </aside>

        <main class="content">
            <article id="post-content" class="markdown-body" aria-live="polite">
                <div style="font-family: 'Fira Code', monospace; display: flex; justify-content: center; align-items: center; height: 30vh; color: var(--text-secondary); font-size: 0.9rem;">
                    <span aria-hidden="true">[</span>Loading document...<span aria-hidden="true">]</span>
                </div>
            </article>
        </main>

        <aside class="sidebar right-sidebar">
            
            <!-- 챕터 제목 (클릭 시 chapter.html로 이동) -->
            <a href="#" id="side-chapter-title-link" class="sidebar-title-link" title="해당 챕터 전체 보기">
                <h3 class="sidebar-title">
                    <span id="side-chapter-title">Chapter</span> 
                    <span class="chapter-count" id="side-chapter-count">[0/0]</span>
                </h3>
            </a>
            
            <!-- 네비게이션 리스트 -->
            <nav id="chapter-nav" class="right-toc-container" aria-label="현재 챕터의 문서 목록"></nav>
            
            <!-- 태그 영역 -->
            <h3 class="sidebar-title">Tags</h3>
            <div class="tags-container" id="tags-container">
                <!-- JS에서 동적으로 렌더링됩니다 -->
            </div>
            
        </aside>
    </div>

    </div> <!-- // 기존 .layout-container 닫는 태그 -->

    <!-- =========================================
         [추가] 모바일 전용 Bottom Bar & Overlay
         ========================================= -->
    <div class="sheet-overlay" id="sheet-overlay"></div>
    
    <nav class="mobile-bottom-bar" id="mobile-bottom-bar" aria-label="모바일 도구 모음">
        <button class="bottom-tab-btn" id="tab-search" aria-expanded="false">
            <span aria-hidden="true">&gt;</span> SEARCH<span aria-hidden="true">_</span>
        </button>
        <button class="bottom-tab-btn" id="tab-toc" aria-expanded="false">
            <span aria-hidden="true">&gt;</span> TOC<span aria-hidden="true">_</span>
        </button>
    </nav>

    <!-- 라이브러리 스크립트 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-footnote/dist/index.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
        
    <script src="../assets/common/common.js"></script>
    <script src="../assets/viewer/doc.js"></script>

    <!-- 커스텀 자바스크립트 -->
    <!-- 커스텀 자바스크립트 -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const contentArea = document.getElementById('post-content');
            const tagsContainer = document.querySelector('.right-sidebar .tags-container');
            const searchForm = document.querySelector('.search-form');
            const searchInput = document.querySelector('.search-input');

            // 1. 공통 유틸리티 초기화
            initProgressBar();
            DocCore.initMarked(); // 마크다운 렌더러 설정

            if (searchForm && searchInput) {
                searchForm.addEventListener('submit', (e) => {
                    if (searchInput.value.trim() === '') {
                        e.preventDefault();
                        showToast('검색어를 입력해주세요.');
                    }
                });
            }

            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');

            // 파라미터가 없으면 빈 화면 출력
            if (!postId) return DocCore.renderSystemMessage('empty', contentArea, tagsContainer);

            try {
                // 2. 데이터 로드
                const [postsResponse, chaptersResponse, libraryResponse] = await Promise.all([
                    fetch('../data/posts.json'),
                    fetch('../data/chapters.json'),
                    fetch('../data/library.json').catch(() => ({ ok: false })) // library.json 추가 로드
                ]);

                if (!postsResponse.ok || !chaptersResponse.ok) throw new Error('DB_LOAD_FAIL');
                
                const rawPosts = await postsResponse.json();
                
                // 기존 posts.json 데이터
                let posts = Object.entries(rawPosts).flatMap(([chapterKey, items]) => 
                    items.map(item => ({ ...item, chapter: chapterKey }))
                );
                
                // library.json 데이터 병합
                if (libraryResponse.ok) {
                    const libPosts = await libraryResponse.json();
                    posts = [...posts, ...libPosts];
                }

                const chapters = await chaptersResponse.json();
                const currentPost = posts.find(p => p.id === postId);
                
                // 데이터 검증 및 에러 처리
                if (!currentPost) return DocCore.renderSystemMessage('404', contentArea, tagsContainer);
                if (currentPost.type === 'lab') return DocCore.renderSystemMessage('wrong_type', contentArea, tagsContainer, postId);
                if (!currentPost.path) throw new Error('INVALID_PATH');

                // 3. UI 업데이트 (사이드바, 태그, 제목)
                document.title = currentPost.title + " - JFB";
                
                if (currentPost.tags && currentPost.tags.length > 0) {
                    tagsContainer.innerHTML = currentPost.tags.map(tag => `<a href="../search/?q=%23${tag}" class="tag">#${tag}</a>`).join('');
                }

                // 챕터 또는 카테고리에 따른 우측 사이드바 데이터 분기 처리
                let chapterPosts = [];
                let sideTitle = 'MODULE';
                let sideLink = '#';

                if (currentPost.chapter) {
                    // 정규 커리큘럼 데이터 (posts.json)
                    chapterPosts = posts.filter(p => p.chapter === currentPost.chapter).sort((a, b) => a.order - b.order);
                    const chapterInfo = chapters[currentPost.chapter];
                    if (chapterInfo) {
                        sideTitle = chapterInfo.title;
                        sideLink = `../path/?id=${currentPost.chapter}`;
                    }
                } else if (currentPost.category) {
                    // 확장 라이브러리 데이터 (library.json)
                    chapterPosts = posts.filter(p => p.category === currentPost.category);
                    sideTitle = currentPost.category.toUpperCase() + '<span aria-hidden="true">_</span>';
                    sideLink = `../satellite/?category=${currentPost.category}`;
                }
                
                document.getElementById('side-chapter-title').innerHTML = sideTitle; // textContent -> innerHTML 로 변경
                document.getElementById('side-chapter-title-link').href = sideLink;
                
                document.getElementById('chapter-nav').innerHTML = chapterPosts.map((p, idx) => {
                    const num = String(idx + 1).padStart(2, '0');
                    const targetPage = p.type === 'lab' ? '../lab/' : '../docs/';
                    return `<a href="${targetPage}?id=${p.id}" class="${p.id === postId ? 'active' : ''}" title="${num}. ${p.title}">${num}. ${p.title}</a>`;
                }).join('');

                const countBadge = document.getElementById('side-chapter-count');
                if(countBadge) countBadge.innerHTML = `<span aria-hidden="true">[</span>${chapterPosts.findIndex(p => p.id === postId) + 1}/${chapterPosts.length}<span aria-hidden="true">]</span>`; // textContent -> innerHTML 로 변경

                // 4. 마크다운 파일 렌더링
                const mdResponse = await fetch(currentPost.path);
                if (!mdResponse.ok) throw new Error('MD_LOAD_FAIL');

                contentArea.innerHTML = marked.parse(await mdResponse.text());

                // 5. 부가 기능 초기화 (하이라이팅, 복사, 목차, 네비게이션)
                Prism.highlightAll();
                DocCore.createCopyButtons(contentArea);
                DocCore.buildToC(contentArea, 'toc');

                // 정규 커리큘럼은 전체 챕터 글을 넘겨 챕터 간 이동 허용
                // 라이브러리는 현재 카테고리(chapterPosts) 내에서만 이동하도록 제한
                let navTargetPosts;
                if (currentPost.chapter) {
                    navTargetPosts = posts.filter(p => p.chapter);
                } else {
                    navTargetPosts = chapterPosts.map((p, i) => ({ ...p, chapter: '1', order: i }));
                }

                DocCore.buildNavigation(postId, navTargetPosts, contentArea);

                setTimeout(() => contentArea.classList.add('loaded'), 100);

            } catch (error) {
                console.error(error);
                DocCore.renderSystemMessage('404', contentArea, tagsContainer); 
            }

            // =========================================
            // [추가] 모바일 바텀 시트 로직
            // =========================================
            const leftSidebar = document.querySelector('.left-sidebar');
            const overlay = document.getElementById('sheet-overlay');
            const tabSearch = document.getElementById('tab-search');
            const tabToc = document.getElementById('tab-toc');
            
            const searchFormEl = leftSidebar.querySelector('.search-form');
            const tocTitleEl = leftSidebar.querySelector('h3.sidebar-title');
            const tocContainerEl = leftSidebar.querySelector('.toc-container');

            function openBottomSheet(target) {
                // 1. 오버레이 및 시트 올리기
                overlay.classList.add('show');
                leftSidebar.classList.add('sheet-open');
                
                // 2. 탭 활성화 상태 변경 및 스크린 리더 상태(aria-expanded) 동기화
                const isSearch = target === 'search';
                const isToc = target === 'toc';

                tabSearch.classList.toggle('active', isSearch);
                tabSearch.setAttribute('aria-expanded', isSearch);

                tabToc.classList.toggle('active', isToc);
                tabToc.setAttribute('aria-expanded', isToc);

                // 3. 누른 탭에 따라 내용 토글
                if (target === 'search') {
                    searchFormEl.classList.remove('sheet-item-hidden');
                    tocTitleEl.classList.add('sheet-item-hidden');
                    tocContainerEl.classList.add('sheet-item-hidden');
                    // 시트가 올라온 후 입력창 포커스
                    setTimeout(() => leftSidebar.querySelector('.search-input').focus(), 300);
                } else if (target === 'toc') {
                    searchFormEl.classList.add('sheet-item-hidden');
                    tocTitleEl.classList.remove('sheet-item-hidden');
                    tocContainerEl.classList.remove('sheet-item-hidden');
                }
            }

            function closeBottomSheet() {
                overlay.classList.remove('show');
                leftSidebar.classList.remove('sheet-open');
                tabSearch.classList.remove('active');
                tabSearch.setAttribute('aria-expanded', 'false');
                tabToc.classList.remove('active');
                tabToc.setAttribute('aria-expanded', 'false');
            }

            // 이벤트 바인딩
            if (tabSearch && tabToc) {
                tabSearch.addEventListener('click', () => {
                    if (leftSidebar.classList.contains('sheet-open') && tabSearch.classList.contains('active')) {
                        closeBottomSheet();
                    } else {
                        openBottomSheet('search');
                    }
                });

                tabToc.addEventListener('click', () => {
                    if (leftSidebar.classList.contains('sheet-open') && tabToc.classList.contains('active')) {
                        closeBottomSheet();
                    } else {
                        openBottomSheet('toc');
                    }
                });
                
                overlay.addEventListener('click', closeBottomSheet);
                
                tocContainerEl.addEventListener('click', (e) => {
                    if (e.target.tagName.toLowerCase() === 'a') {
                        closeBottomSheet();
                    }
                });
            }

            // =========================================
            // [추가] 스크롤 방향 감지 및 플로팅 바 자동 숨김
            // =========================================
            const bottomBar = document.getElementById('mobile-bottom-bar');
            let lastScrollY = window.scrollY;
            let ticking = false;

            window.addEventListener('scroll', () => {
                // 데스크탑 모드에서는 동작하지 않도록 예외 처리
                if (!bottomBar || window.innerWidth > 1024) return;

                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        const currentScrollY = window.scrollY;
                        
                        // 바텀 시트가 열려있을 때는 항상 보여야 함
                        if (leftSidebar.classList.contains('sheet-open')) {
                            bottomBar.classList.remove('hide');
                        } else {
                            // 스크롤이 맨 위거나, 위로 올릴 때는 나타남
                            if (currentScrollY < 10 || currentScrollY < lastScrollY) {
                                bottomBar.classList.remove('hide');
                            } 
                            // 스크롤을 아래로 내릴 때 (일정 거리 이상 내려갔을 때 숨김)
                            else if (currentScrollY > lastScrollY && currentScrollY > 50) {
                                bottomBar.classList.add('hide');
                            }
                        }
                        
                        lastScrollY = currentScrollY;
                        ticking = false;
                    });
                    ticking = true;
                }
            }, { passive: true });
        });
    </script>
</body>
</html>
