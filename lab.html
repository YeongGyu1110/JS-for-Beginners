<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab - JFB</title>
    
    <!-- 코드 하이라이팅 테마 (Tomorrow Night) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    
    <!-- 웹 폰트: Pretendard (본문용), Fira Code (코드용) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="icon" href="favicon.png" type="image/png">

    <style>
        /* =========================================
           1. 공통 테마 변수 (기존 파일들과 일치)
           ========================================= */
        :root {
            --bg-color: #0c0d0f;
            --surface-color: #13151a;
            --surface-hover: #191c22;
            --text-heading: #f8fafc;
            --text-primary: #cbd5e1;
            --text-secondary: #64748b;
            --accent-color: #ff6b00; 
            --border-color: #22252e;
            --radius-md: 4px;
            --radius-sm: 2px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        
        body {
            background-color: var(--bg-color); color: var(--text-primary);
            font-family: 'Pretendard', sans-serif; font-size: 15px; line-height: 1.75;
            -webkit-font-smoothing: antialiased;
            background-image: linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.012) 1px, transparent 1px);
            background-size: 32px 32px; background-attachment: fixed; 
        }

        /* 진행률 바 */
        .progress-container { width: 100%; height: 2px; background: transparent; position: fixed; top: 0; z-index: 1001; }
        .progress-bar { height: 100%; background: var(--accent-color); width: 0%; transition: width 0.1s ease-out; }
        
        .header {
            padding: 1rem 2rem; position: sticky; top: 0; z-index: 100;
            background-color: rgba(12, 13, 15, 0.9); backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
        }
        .logo { font-family: 'Fira Code', monospace; font-size: 1.15rem; font-weight: 700; color: var(--text-heading); letter-spacing: -0.5px; display: flex; align-items: center; gap: 6px; text-decoration: none; }
        .logo span { color: var(--accent-color); animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* =========================================
           2. 레이아웃 (3단 그리드 구조 유지)
           ========================================= */
        .layout-container {
            display: grid; grid-template-columns: 200px minmax(0, 760px) 200px; gap: 4rem;
            max-width: 1360px; margin: 3rem auto; padding: 0 2rem; align-items: start; justify-content: center;
        }
        .sidebar { position: sticky; top: 100px; max-height: calc(100vh - 120px); overflow-y: auto; }
        .sidebar::-webkit-scrollbar { width: 0; }
        .sidebar-title { font-family: 'Fira Code', monospace; font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 1.2rem; text-transform: uppercase; letter-spacing: 2px; }

        /* 좌측 목차 (ToC) 스타일 */
        .toc-container { position: relative; }
        .toc-container a { display: block; color: var(--text-secondary); text-decoration: none; margin-bottom: 0.6rem; font-size: 0.8rem; font-family: 'Fira Code', monospace; transition: color 0.15s ease; padding-left: 12px; position: relative; }
        .toc-container a::before { content: "·"; position: absolute; left: 0; opacity: 0.5; }
        .toc-container a:hover { color: var(--text-heading); }
        .toc-container a.active { color: var(--accent-color); font-weight: 500; }
        .toc-container a.active::before { content: ">"; color: var(--accent-color); opacity: 1; }
        .toc-h2 { margin-left: 0; }
        .toc-h3 { margin-left: 10px; font-size: 0.75rem !important; }

        /* 우측 챕터 정보 스타일 (index.html 스타일 유지용) */
        .sidebar-title-link { text-decoration: none; display: inline-block; margin-top: 2rem; margin-bottom: 1.2rem; transition: opacity 0.2s ease; }
        .sidebar-title-link:hover { opacity: 0.7; }
        .sidebar-title-link .sidebar-title { margin-bottom: 0; display: flex; align-items: center; gap: 8px; transition: color 0.2s ease; }
        .sidebar-title-link:hover .sidebar-title { color: var(--accent-color); }
        .chapter-count { color: var(--text-secondary); font-size: 0.7rem; font-weight: 400; letter-spacing: 0; }
        
        .right-toc-container { position: relative; display: flex; flex-direction: column; margin-bottom: 2.5rem; }
        .right-toc-container a { display: block; color: var(--text-secondary); text-decoration: none; margin-bottom: 0.6rem; font-size: 0.8rem; font-family: 'Fira Code', monospace; transition: color 0.15s ease; position: relative; padding-left: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .right-toc-container a::before { content: "·"; position: absolute; left: 0; color: var(--text-secondary); opacity: 0.5; }
        .right-toc-container a:hover { color: var(--text-heading); }
        .right-toc-container a.active { color: var(--accent-color); font-weight: 500; }
        .right-toc-container a.active::before { content: ">"; color: var(--accent-color); opacity: 1; }

        .tags-container { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .tag { font-family: 'Fira Code', monospace; background-color: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-secondary); text-decoration: none; padding: 0.25rem 0.5rem; border-radius: var(--radius-sm); font-size: 0.75rem; transition: all 0.15s ease; }
        .tag:hover { border-color: var(--accent-color); color: var(--accent-color); }

        /* =========================================
           3. 마크다운 및 실습 전용 스타일
           ========================================= */
        .content { padding: 0 0 4rem 0; }
        .markdown-body { display: none; opacity: 0; transform: translateY(10px); transition: opacity 0.4s ease, transform 0.4s ease; }
        .markdown-body.loaded { display: block; opacity: 1; transform: translateY(0); }
        
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { color: var(--text-heading); font-weight: 700; margin-top: 2rem; margin-bottom: 1rem; letter-spacing: -0.5px; scroll-margin-top: 90px; }
        .markdown-body h1 { font-size: 2.2rem; margin-top: 1rem; }
        .markdown-body h2 { font-size: 1.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color); }
        .markdown-body h3 { font-size: 1.2rem; }
        .markdown-body p { margin-bottom: 1.6rem; font-size: 0.98rem; word-break: keep-all; }
        
        /* pre 코드 스타일 */
        .markdown-body pre { background-color: var(--surface-color) !important; border: 1px solid var(--border-color); border-radius: var(--radius-md); margin: 2.5rem 0 !important; padding: 1.25rem !important; position: relative; }
        .markdown-body pre code { font-family: 'Fira Code', monospace !important; font-size: 0.9rem; }
        :not(pre) > code { background-color: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-heading); padding: 0.2em 0.4em; border-radius: var(--radius-sm); font-family: 'Fira Code', monospace; font-size: 0.88em; }

        .copy-button {
            position: absolute; top: 10px; right: 10px; background-color: var(--bg-color); border: 1px solid var(--border-color);
            color: var(--text-secondary); padding: 4px 8px; border-radius: var(--radius-sm); font-size: 0.7rem; cursor: pointer;
            opacity: 0; transition: all 0.15s ease; display: inline-flex; align-items: center; gap: 4px; font-family: 'Fira Code', monospace;
        }
        .markdown-body pre:hover .copy-button { opacity: 1; }
        .copy-button:hover { background-color: var(--surface-hover); color: var(--text-heading); }
        .copy-button.copied { background-color: var(--accent-color); border-color: var(--accent-color); color: #fff; }

        /* 실습 인트로 / 아웃트로 및 버튼 */
        .lab-action-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 1rem 2rem; background-color: var(--bg-color); border: 1px solid var(--accent-color);
            color: var(--accent-color); font-family: 'Fira Code', monospace; font-size: 1rem; font-weight: 600;
            border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s ease; margin-top: 2rem; width: 100%;
        }
        .lab-action-btn:hover { background-color: var(--accent-color); color: #fff; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255, 107, 0, 0.2); }

        .lab-intro, .lab-outro {
            text-align: center; padding: 4rem 2rem; border: 1px dashed var(--border-color); border-radius: var(--radius-md);
            background-color: var(--surface-color); margin-bottom: 2rem;
        }
        .lab-intro.hidden, .lab-outro.hidden { display: none; }
        .lab-intro h1, .lab-outro h1 { color: var(--text-heading); font-family: 'Fira Code', monospace; font-size: 2rem; margin-bottom: 1rem; letter-spacing: -1px; }
        .lab-intro p { color: var(--text-secondary); margin-bottom: 2rem; }

        /* 실습 체크 포인트용 개별 태스크 버튼 */
        .lab-task-btn {
            display: flex; align-items: center; width: 100%; padding: 1.2rem 1.5rem; margin: 2rem 0;
            background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--radius-sm);
            cursor: pointer; transition: all 0.2s ease; text-align: left;
            font-family: 'Fira Code', monospace; font-size: 0.9rem; color: var(--text-primary);
        }
        .lab-task-btn .status-box { font-weight: bold; margin-right: 15px; color: var(--text-secondary); width: 40px; }
        .lab-task-btn .task-text { flex: 1; transition: color 0.2s ease; }
        .lab-task-btn:hover:not(.loading):not(.completed) { border-color: var(--accent-color); background-color: var(--surface-hover); }
        
        .lab-task-btn.loading { border-color: var(--text-secondary); cursor: wait; animation: pulseBg 1s infinite alternate; }
        .lab-task-btn.loading .status-box { color: var(--text-heading); }
        .lab-task-btn.loading .task-text { color: var(--text-heading); }
        @keyframes pulseBg { 0% { background-color: var(--bg-color); } 100% { background-color: var(--surface-color); } }

        .lab-task-btn.completed { border-color: var(--accent-color); background-color: rgba(255, 107, 0, 0.05); cursor: default; }
        .lab-task-btn.completed .status-box { color: var(--accent-color); }
        .lab-task-btn.completed .task-text { color: var(--text-heading); text-decoration: line-through; opacity: 0.7; }

        /* 실습 대시보드 박스 디자인 (Standby 시 감춰짐) */
        .dashboard-box { background-color: var(--surface-color); border: 1px solid var(--border-color); padding: 1.5rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; }
        .dash-label { font-size: 0.75rem; color: var(--text-secondary); font-family: 'Fira Code', monospace; margin-bottom: 0.5rem; display: block; }
        .dash-value { font-size: 1.5rem; color: var(--text-heading); font-family: 'Fira Code', monospace; font-weight: 700; }
        .dash-value span { color: var(--accent-color); }
        
        .status-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background-color: var(--text-secondary); margin-right: 8px; }
        .status-indicator.active { background-color: #10b981; box-shadow: 0 0 8px #10b981; animation: blink 2s infinite; }

        /* 시스템 메시지 및 404 (index.html 연동) */
        .system-message-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; text-align: center; font-family: 'Fira Code', monospace; }
        .system-message-title { color: var(--accent-color); font-size: 4rem; margin-bottom: 1rem; line-height: 1; }
        .system-message-subtitle { color: var(--text-heading); font-size: 1.5rem; margin-bottom: 0.5rem; font-weight: 600; }
        .system-message-desc { color: var(--text-secondary); margin-bottom: 3rem; font-family: 'Pretendard', sans-serif; font-size: 0.95rem; }
        .return-home-btn { display: inline-block; color: var(--text-primary); text-decoration: none; border: 1px solid var(--border-color); background-color: var(--surface-color); padding: 0.6rem 1.2rem; border-radius: var(--radius-sm); transition: all 0.2s ease; }
        .return-home-btn:hover { color: var(--accent-color); border-color: var(--accent-color); transform: translateY(-2px); }

        /* 토스트 알림 */
        .toast-notification { position: fixed; bottom: -60px; left: 50%; transform: translateX(-50%); background-color: var(--surface-color); border: 1px solid var(--accent-color); color: var(--text-heading); padding: 0.8rem 1.5rem; border-radius: var(--radius-sm); font-family: 'Fira Code', monospace; font-size: 0.85rem; z-index: 9999; opacity: 0; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); pointer-events: none; }
        .toast-notification::before { content: "[!] "; color: var(--accent-color); font-weight: bold; }
        .toast-notification.show { bottom: 40px; opacity: 1; }

        @media (max-width: 1024px) {
            .layout-container { grid-template-columns: 1fr; gap: 2rem; padding: 0 1.5rem; margin: 1.5rem auto; }
            .sidebar { position: static; max-height: none; }
            .left-sidebar { order: -1; }
            .right-sidebar { order: 2; border-top: 1px solid var(--border-color); padding-top: 2rem; margin-top: 1rem; }
        }
    </style>
</head>
<body>
    <div class="progress-container"><div class="progress-bar" id="myBar"></div></div>
    
    <header class="header">
        <a href="main.html" class="logo" style="text-decoration: none;">JFB<span>_</span></a>
    </header>

    <div class="layout-container">
        <!-- 1. 좌측 영역 (목차는 실습 여부와 관계없이 항상 노출) -->
        <aside class="sidebar left-sidebar">
            <h3 class="sidebar-title">On this page</h3>
            <nav id="toc" class="toc-container"></nav>
        </aside>

        <!-- 2. 중앙 본문 영역 -->
        <main class="content">
            <!-- 로딩 바인더 -->
            <div id="loader-state" style="font-family: 'Fira Code', monospace; display: flex; justify-content: center; align-items: center; height: 30vh; color: var(--text-secondary); font-size: 0.9rem;">
                [Loading document database...]
            </div>

            <!-- 인트로 화면 -->
            <section id="lab-intro" class="lab-intro" style="display: none;">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--accent-color)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:1rem;">
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
                <h1>LAB ENVIRONMENT READY</h1>
                <p id="lab-intro-desc">본 실습 파일은 클라이언트의 휘발성 세션을 이용합니다.<br>우측 대시보드 상태를 확인하면서 각 실습 단계를 직접 실행해보세요.</p>
                <button id="btn-start-lab" class="lab-action-btn">> INITIALIZE_WORKSPACE_</button>
            </section>

            <!-- 실습 마크다운 콘텐츠 영역 -->
            <article id="lab-content" class="markdown-body"></article>

            <!-- 실습 완료제출 버튼 (시작 후에만 보임) -->
            <button id="btn-end-lab" class="lab-action-btn" style="display: none; margin-top: 4rem;">
                > TERMINATE_AND_SUBMIT_
            </button>

            <!-- 아웃트로 화면 (완료 시 노출) -->
            <section id="lab-outro" class="lab-outro hidden">
                <h1 id="scramble-success"></h1>
                <p style="color: var(--text-primary); font-family: 'Fira Code', monospace; margin-bottom: 2rem;">
                    LAB_COMPLETED: <span id="final-score" style="color: var(--accent-color); font-weight: bold;"></span>
                </p>
                <a href="main.html" class="lab-action-btn" style="width: auto;">> RETURN_TO_MAIN_</a>
            </section>
        </main>

        <!-- 3. 우측 사이드바 영역 (실습 상태에 따라 동적으로 요소가 바뀝니다) -->
        <aside class="sidebar right-sidebar">
            
            <!-- [상태 A] 실습 대기 중일 때 표시되는 글 정보 (index.html 구조와 완벽 호환) -->
            <div id="sidebar-standby-state">
                <a href="#" id="side-chapter-title-link" class="sidebar-title-link" title="해당 챕터 전체 보기">
                    <h3 class="sidebar-title">
                        <span id="side-chapter-title">Chapter</span> 
                        <span class="chapter-count" id="side-chapter-count">[0/0]</span>
                    </h3>
                </a>
                <nav id="chapter-nav" class="right-toc-container"></nav>
                
                <h3 class="sidebar-title">Tags</h3>
                <div class="tags-container" id="tags-container"></div>
            </div>

            <!-- [상태 B] 실습 진행 중(Active) 일 때 표시되는 요소 -->
            <div id="sidebar-active-state" style="display: none;">
                <div class="dashboard-box">
                    <span class="dash-label">ENVIRONMENT</span>
                    <div style="font-family: 'Fira Code', monospace; font-size: 0.9rem; display: flex; align-items: center; color: var(--text-heading);">
                        <span id="status-dot" class="status-indicator"></span>
                        <span id="status-text">STANDBY</span>
                    </div>
                </div>

                <div class="dashboard-box">
                    <span class="dash-label">MISSIONS_COMPLETED</span>
                    <div class="dash-value">
                        <span id="dash-completed">0</span> / <span id="dash-total" style="color: var(--text-secondary);">0</span>
                    </div>
                </div>
            </div>

        </aside>
    </div>

    <!-- 라이브러리 스크립트 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>

    <!-- 실습 및 네비게이션 제어 스크립트 -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');

            const loaderState = document.getElementById('loader-state');
            const labIntro = document.getElementById('lab-intro');
            const labContent = document.getElementById('lab-content');
            const labOutro = document.getElementById('lab-outro');
            const btnStart = document.getElementById('btn-start-lab');
            const btnEnd = document.getElementById('btn-end-lab');

            // 우측 사이드바 상태 컨테이너들
            const sidebarStandby = document.getElementById('sidebar-standby-state');
            const sidebarActive = document.getElementById('sidebar-active-state');
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            const dashCompleted = document.getElementById('dash-completed');
            const dashTotal = document.getElementById('dash-total');

            let isLabActive = false;
            let totalTasks = 0;
            let completedTasks = 0;
            let targetMdPath = null;

            // 1. JSON 기반 메타데이터 바인딩 및 예외 처리 (index.html 복사)
            const renderError = (code, subtitle, desc) => {
                document.title = `${code} - JFB`;
                loaderState.style.display = 'none';
                labContent.innerHTML = `
                    <div class="system-message-container">
                        <h1 class="system-message-title">${code}</h1>
                        <h2 class="system-message-subtitle">${subtitle}</h2>
                        <p class="system-message-desc">${desc}</p>
                        <a href="main.html" class="return-home-btn">> RETURN_TO_MAIN_</a>
                    </div>
                `;
                labContent.style.display = 'block';
                labContent.classList.add('loaded');
            };

            if (!postId) {
                return renderError("EMPTY", "NO_LAB_SELECTED", "실습 파일 식별자가 전달되지 않았습니다.");
            }

            try {
                // 데이터 병렬 호출
                const [postsResponse, chaptersResponse] = await Promise.all([
                    fetch('./data/posts.json'),
                    fetch('./data/chapters.json')
                ]);

                if (!postsResponse.ok || !chaptersResponse.ok) throw new Error("DB_LOAD_FAIL");

                const posts = await postsResponse.json();
                const chapters = await chaptersResponse.json();
                const currentPost = posts.find(p => p.id === postId);

                if (!currentPost) {
                    return renderError("404", "LAB_NOT_FOUND", "요청하신 실습 문서가 데이터베이스에 존재하지 않습니다.");
                }

                targetMdPath = currentPost.path;
                document.title = `${currentPost.title} (Lab) - JFB`;

                // [보안/오류 검증]
                if (!targetMdPath.startsWith('./script/')) {
                    return renderError("SECURE_ERR", "UNAUTHORIZED_PATH", "접근할 수 없는 스크립트 경로가 포함되었습니다.");
                }

                // 우측 사이드바: 챕터 및 글 메타 세팅
                const chapterId = currentPost.chapter;
                const chapterInfo = chapters[chapterId];
                const chapterPosts = posts.filter(p => p.chapter === chapterId).sort((a, b) => a.order - b.order);

                if (chapterInfo) {
                    document.getElementById('side-chapter-title').textContent = chapterInfo.title;
                    document.getElementById('side-chapter-title-link').href = `chapter.html?id=${chapterId}`;
                }

                // 챕터 목록 생성
                const chapterNav = document.getElementById('chapter-nav');
                chapterNav.innerHTML = chapterPosts.map((p, idx) => {
                    const num = String(idx + 1).padStart(2, '0');
                    return `<a href="lab.html?id=${p.id}" class="${p.id === postId ? 'active' : ''}" title="${num}. ${p.title}">${num}. ${p.title}</a>`;
                }).join('');

                const currentIndex = chapterPosts.findIndex(p => p.id === postId) + 1;
                document.getElementById('side-chapter-count').textContent = `[${currentIndex}/${chapterPosts.length}]`;

                // 태그 세팅
                const tagsContainer = document.getElementById('tags-container');
                if (currentPost.tags && currentPost.tags.length > 0) {
                    tagsContainer.innerHTML = currentPost.tags.map(tag => 
                        `<a href="search.html?q=%23${tag}" class="tag">#${tag}</a>`
                    ).join('');
                }

                // 로더 숨기고 시작 설명창 노출
                loaderState.style.display = 'none';
                labIntro.style.display = 'block';
                if(currentPost.description) {
                    document.getElementById('lab-intro-desc').innerHTML = `${currentPost.description}<br><br><span style="color:var(--text-secondary)">본 실습은 일회성 환경이며, 페이지 이탈 시 기록이 유지되지 않습니다.</span>`;
                }

            } catch (error) {
                console.error(error);
                return renderError("SYS_ERR", "DATABSE_FAILURE", "서버 통신 중 장애가 발생했습니다.");
            }

            // =========================================
            // [기능 2] 실습 시작 버튼 이벤트 리스너
            // =========================================
            btnStart.addEventListener('click', async () => {
                if (!targetMdPath) return;

                try {
                    // 마크다운 파일 호출
                    const mdRes = await fetch(targetMdPath);
                    if (!mdRes.ok) throw new Error("FILE_LOAD_ERR");
                    
                    const rawMd = await mdRes.text();
                    
                    // 마크다운 파싱 및 본문 로딩
                    labContent.innerHTML = marked.parse(rawMd);
                    Prism.highlightAll();
                    createCopyButtons();

                    // 좌측 ToC 목차 파싱 생성 (실습 진행 중에도 좌측 목차는 유지됨)
                    const headings = labContent.querySelectorAll('h2, h3');
                    const tocContainer = document.getElementById('toc');
                    tocContainer.innerHTML = '';
                    headings.forEach((heading, index) => {
                        if (!heading.id) heading.id = `heading-${index}`;
                        const link = document.createElement('a');
                        link.href = `#${heading.id}`;
                        link.textContent = heading.textContent;
                        link.className = `toc-link toc-${heading.tagName.toLowerCase()}`;
                        tocContainer.appendChild(link);
                    });

                    // ToC 스크롤 인터랙션
                    const tocLinks = document.querySelectorAll('.toc-link');
                    const observerOptions = { root: null, rootMargin: "-85px 0px -70% 0px", threshold: 0 };
                    const activeHeadings = new Set();
                    const observer = new IntersectionObserver(entries => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) activeHeadings.add(entry.target);
                            else activeHeadings.delete(entry.target);
                        });
                        if (activeHeadings.size > 0) {
                            let topHeading = null;
                            let minTop = Infinity;
                            activeHeadings.forEach(heading => {
                                const rect = heading.getBoundingClientRect();
                                if (rect.top < minTop) { minTop = rect.top; topHeading = heading; }
                            });
                            if (topHeading) {
                                tocLinks.forEach(link => link.classList.remove('active'));
                                const activeLink = document.querySelector(`.toc-link[href="#${topHeading.id}"]`);
                                if (activeLink) activeLink.classList.add('active');
                            }
                        }
                    }, observerOptions);
                    headings.forEach(heading => observer.observe(heading));

                    // 실습 버튼 요소(lab-task-btn) 후킹
                    const taskBtns = document.querySelectorAll('.lab-task-btn');
                    totalTasks = taskBtns.length;
                    dashTotal.textContent = totalTasks;
                    
                    taskBtns.forEach(btn => {
                        btn.addEventListener('click', async function() {
                            if(this.classList.contains('loading') || this.classList.contains('completed')) return;

                            // 로딩 활성화 및 기믹 실행
                            this.classList.add('loading');
                            const statusBox = this.querySelector('.status-box');
                            const textBox = this.querySelector('.task-text');
                            const originalText = textBox.innerText;

                            statusBox.innerText = '[-]';
                            textBox.innerText = 'SYSTEM_CHECKING..._';

                            // 1.2초 대기 (가짜 체크)
                            await new Promise(res => setTimeout(res, 1200));

                            this.classList.remove('loading');
                            this.classList.add('completed');
                            statusBox.innerHTML = '✔';
                            textBox.innerText = originalText;

                            completedTasks++;
                            dashCompleted.textContent = completedTasks;
                            
                            showToast(`체크포인트 완료 (${completedTasks}/${totalTasks})`);
                        });
                    });

                    // -----------------------------------------
                    // 핵심 변경: 실습 시작 시 우측 사이드바 요소 스위칭
                    // -----------------------------------------
                    isLabActive = true;
                    sidebarStandby.style.display = 'none'; // 같은 챕터 글 목록 숨김
                    sidebarActive.style.display = 'block'; // ENVIRONMENT & MISSIONS 띄움

                    statusDot.classList.add('active');
                    statusText.textContent = "CONNECTED_STABLE";
                    statusText.style.color = "#10b981";

                    // 본문 노출 및 인트로 닫기
                    labIntro.style.display = 'none';
                    labContent.classList.add('loaded');
                    btnEnd.style.display = 'inline-flex';

                } catch (e) {
                    console.error(e);
                    renderError("ERR", "MARKDOWN_RENDER_FAILED", "실습 마크다운 문서를 읽어오는 도중 실패했습니다.");
                }
            });

            // =========================================
            // [기능 3] 실습 종료/제출 버튼 이벤트 리스너
            // =========================================
            btnEnd.addEventListener('click', () => {
                if (completedTasks < totalTasks) {
                    const confirmExit = confirm(`아직 해결하지 않은 미션이 ${totalTasks - completedTasks}개 있습니다. 이대로 실습을 완료하시겠습니까?`);
                    if (!confirmExit) return;
                }

                // 세션 비활성화 (이탈 경고창 회피)
                isLabActive = false;

                // UI 비활성화 및 아웃트로 노출
                labContent.style.display = 'none';
                btnEnd.style.display = 'none';
                labOutro.classList.remove('hidden');

                // 우측 사이드바 리셋 (원래대로 글 목록 상태로 원복)
                sidebarActive.style.display = 'none';
                sidebarStandby.style.display = 'block';

                // 아웃트로 요약 및 텍스트 스크램블
                document.getElementById('final-score').textContent = `${completedTasks} / ${totalTasks} MISSIONS`;
                const titleEl = document.getElementById('scramble-success');
                const fx = new TextScrambler(titleEl);
                fx.setText('LAB_COMPLETED_SUCCESSFULLY');

                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // =========================================
            // [기능 4] 이탈 방지 브라우저 경고 (beforeunload)
            // =========================================
            window.addEventListener('beforeunload', (e) => {
                if (isLabActive) {
                    e.preventDefault();
                    e.returnValue = ''; // 표준 경고 대화상자 노출
                }
            });

            // 토스트 알림 컴포넌트
            const showToast = (message) => {
                let existingToast = document.querySelector('.toast-notification');
                if (existingToast) existingToast.remove();
                const toast = document.createElement('div');
                toast.className = 'toast-notification';
                toast.textContent = message;
                document.body.appendChild(toast);
                setTimeout(() => toast.classList.add('show'), 10);
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, 2500);
            };
        });

        // 코드 복사 기능 바인딩 (index.html 기능 동일 복사)
        function createCopyButtons() {
            const preElements = document.querySelectorAll('.markdown-body pre');
            preElements.forEach((pre) => {
                if (pre.querySelector('.copy-button')) return;
                const button = document.createElement('button');
                button.className = 'copy-button';
                button.innerHTML = `<span>COPY</span>`;
                pre.appendChild(button);
                button.addEventListener('click', async () => {
                    const codeElement = pre.querySelector('code');
                    if (!codeElement) return;
                    try {
                        await navigator.clipboard.writeText(codeElement.innerText);
                        button.classList.add('copied');
                        button.innerHTML = `<span>DONE</span>`;
                        setTimeout(() => {
                            button.classList.remove('copied');
                            button.innerHTML = `<span>COPY</span>`;
                        }, 1500);
                    } catch (err) {
                        button.innerText = 'ERR';
                    }
                });
            });
        }

        // 텍스트 모핑 스크램블 효과
        class TextScrambler {
            constructor(el) { this.el = el; this.chars = '!<>-_\\/[]{}—=+*^?#@&%0123456789'; this.update = this.update.bind(this); }
            setText(newText) {
                const oldText = this.el.innerText; const length = Math.max(oldText.length, newText.length);
                const promise = new Promise((resolve) => (this.resolve = resolve)); this.queue = [];
                for (let i = 0; i < length; i++) {
                    const from = oldText[i] || ''; const to = newText[i] || '';
                    const start = Math.floor(Math.random() * 40); const end = start + Math.floor(Math.random() * 40);
                    this.queue.push({ from, to, start, end });
                }
                cancelAnimationFrame(this.frameRequest); this.frame = 0; this.update(); return promise;
            }
            update() {
                let output = ''; let complete = 0;
                for (let i = 0, n = this.queue.length; i < n; i++) {
                    let { from, to, start, end, char } = this.queue[i];
                    if (this.frame >= end) { complete++; output += to; }
                    else if (this.frame >= start) {
                        if (!char || Math.random() < 0.28) { char = this.chars[Math.floor(Math.random() * this.chars.length)]; this.queue[i].char = char; }
                        output += `<span style="color: var(--accent-color)">${char}</span>`;
                    } else { output += from; }
                }
                this.el.innerHTML = output;
                if (complete === this.queue.length) { this.resolve(); } else { this.frameRequest = requestAnimationFrame(this.update); this.frame++; }
            }
        }
    </script>
