<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JFB Archive - Document Library</title>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="./common/common.css">
    
    <style>
        /* =========================================
           1. 라이브러리 전체 레이아웃
           ========================================= */
        .library-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem 5rem 2rem;
            display: flex;
            align-items: flex-start;
            gap: 3rem;
            min-height: 70vh;
        }

        /* =========================================
           2. 왼쪽 사이드바 (카테고리 네비게이션)
           ========================================= */
        .sidebar {
            width: 240px;
            flex-shrink: 0;
            position: sticky;
            top: 100px; /* 헤더 아래 고정 */
        }

        .sidebar-title {
            font-family: 'Fira Code', monospace;
            font-size: 1rem;
            color: var(--text-heading);
            margin-bottom: 1.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid var(--border-color);
        }
        .sidebar-title span { color: var(--accent-color); }

        .category-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .category-link {
            display: block;
            padding: 0.75rem 1rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            border-left: 2px solid transparent;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            transition: all 0.2s ease;
        }

        .category-link:hover {
            color: var(--text-primary);
            background-color: var(--surface-hover);
        }

        .category-link.active {
            color: var(--accent-color);
            background-color: rgba(255, 107, 0, 0.05);
            border-left-color: var(--accent-color);
            font-weight: 600;
        }

        /* =========================================
           3. 오른쪽 메인 콘텐츠 영역 (문서 카드 그리드)
           ========================================= */
        .main-content {
            flex-grow: 1;
            min-width: 0; /* flex 자식 넘침 방지 */
        }

        .content-header {
            margin-bottom: 2rem;
        }

        .current-category-title {
            font-family: 'Fira Code', monospace;
            font-size: 1.8rem;
            color: var(--text-heading);
            margin-bottom: 0.5rem;
        }
        
        .current-category-title::before {
            content: "> ";
            color: var(--accent-color);
        }

        .doc-count {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-family: 'Fira Code', monospace;
        }

        .docs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        /* 개별 문서 카드 디자인 */
        .doc-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            transition: all 0.2s ease;
        }

        .doc-card:hover {
            transform: translateY(-4px);
            border-color: var(--text-secondary);
            background-color: var(--surface-hover);
        }

        .doc-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .doc-category-badge {
            font-family: 'Fira Code', monospace;
            font-size: 0.7rem;
            color: var(--accent-color);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .doc-title {
            color: var(--text-heading);
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            line-height: 1.4;
            word-break: keep-all;
        }

        .doc-desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .doc-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px dashed var(--border-color);
        }

        /* 빈 상태 메시지 */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            background-color: var(--surface-color);
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            font-family: 'Fira Code', monospace;
        }

        /* =========================================
           4. 반응형 레이아웃 (모바일)
           ========================================= */
        @media (max-width: 768px) {
            .library-wrapper {
                flex-direction: column;
                padding: 1.5rem;
                gap: 2rem;
            }

            /* 사이드바를 상단 가로 스크롤 탭으로 변환 */
            .sidebar {
                width: 100%;
                position: static;
            }

            .sidebar-title {
                display: none; /* 모바일에서는 텍스트 숨김 */
            }

            .category-list {
                flex-direction: row;
                overflow-x: auto;
                padding-bottom: 0.5rem;
                border-bottom: 1px solid var(--border-color);
                scrollbar-width: none; /* Firefox */
            }
            .category-list::-webkit-scrollbar { display: none; } /* Chrome */

            .category-link {
                white-space: nowrap;
                border-left: none;
                border-bottom: 2px solid transparent;
                border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            }

            .category-link.active {
                border-left-color: transparent;
                border-bottom-color: var(--accent-color);
                background-color: transparent;
            }

            .current-category-title {
                font-size: 1.5rem;
            }

            .docs-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="main.html" class="logo">JFB<span>_</span> ARCHIVE</a>
    </header>

    <div class="library-wrapper">
        <!-- 좌측 사이드바 (카테고리) -->
        <aside class="sidebar">
            <h3 class="sidebar-title"><span>></span> CATEGORIES_</h3>
            <ul class="category-list" id="category-list">
                <!-- 자바스크립트로 렌더링됩니다 -->
            </ul>
        </aside>

        <!-- 우측 메인 콘텐츠 (문서 리스트) -->
        <main class="main-content">
            <div class="content-header">
                <h2 class="current-category-title" id="current-category-title">LOADING...</h2>
                <div class="doc-count" id="doc-count">[ SEARCHING_DATABASE... ]</div>
            </div>

            <div class="docs-grid" id="docs-grid">
                <!-- 자바스크립트로 문서 카드가 렌더링됩니다 -->
            </div>
        </main>
    </div>

    <!-- 푸터 -->
    <footer class="footer">
        <!-- 기존 main.html 푸터 내용과 동일하게 유지 -->
        <div class="footer-content" style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; border-top: 1px solid var(--border-color); padding: 2rem 0; font-family: 'Fira Code', monospace;">
            <div>
                <div style="color: var(--text-heading); font-weight: 700;">JFB<span>_</span> ARCHIVE</div>
            </div>
            <div style="font-size: 0.75rem; color: var(--text-secondary); text-align: right;">
                <div>SYS_STATUS: <span style="color: #10b981;">ONLINE</span></div>
            </div>
        </div>
    </footer>

    <script src="./common/common.js"></script>
    <script>
        // 데이터 병합 및 로드 함수
        async function fetchAllDocuments() {
            let allDocs = [];
            
            try {
                // 1. posts.json (자바스크립트 가이드) 가져오기
                const postsRes = await fetch('./data/posts.json');
                if (postsRes.ok) {
                    const rawPosts = await postsRes.json();
                    
                    // [수정된 부분] 
                    // flat()으로 배열을 풀면서, 동시에 map()을 이용해 모든 객체에 category: 'javascript'를 강제로 주입합니다.
                    const jsPosts = Object.values(rawPosts)
                        .flat()
                        .map(post => ({ ...post, category: 'javascript' })); 
                    
                    allDocs = [...allDocs, ...jsPosts];
                }

                // 2. library.json (기타 문서들) 가져오기
                const libRes = await fetch('./data/library.json');
                if (libRes.ok) {
                    const libPosts = await libRes.json();
                    // library.json 안의 데이터들은 각자 다른 카테고리(markdown 등)를 가져야 하므로
                    // JSON 파일 안에 "category" 프로퍼티가 적혀 있어야 합니다.
                    allDocs = [...allDocs, ...libPosts];
                }
            } catch (e) {
                console.warn('데이터 로드 중 일부 실패:', e);
            }

            return allDocs;
        }

        // 카테고리 ID를 예쁜 이름으로 변환해주는 헬퍼 함수
        function formatCategoryName(categoryId) {
            // 특별히 원하는 표기법이 있는 경우 예외 처리
            if (categoryId === 'javascript') return 'JavaScript Guide';
            if (categoryId === 'discord-js') return 'Discord.js';
            if (categoryId === 'css') return 'CSS / Style';
            
            // 그 외의 경우는 하이픈(-)을 공백으로 바꾸고 첫 글자를 대문자로 변환
            // 예: "python-basic" -> "Python Basic"
            return categoryId.split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        }

        // 사이드바 렌더링 함수 (동적 생성 방식으로 변경됨)
        function renderSidebar(categories, currentCategory) {
            const listEl = document.getElementById('category-list');
            
            listEl.innerHTML = categories.map(category => {
                const isActive = category === currentCategory ? 'active' : '';
                const label = formatCategoryName(category);
                return `
                    <li>
                        <a href="library.html?category=${category}" class="category-link ${isActive}">
                            ${label}
                        </a>
                    </li>
                `;
            }).join('');
        }

        // 메인 문서 그리드 렌더링 함수
        function renderDocs(docs, currentCategory) {
            const gridEl = document.getElementById('docs-grid');
            const titleEl = document.getElementById('current-category-title');
            const countEl = document.getElementById('doc-count');

            // 현재 카테고리 제목 세팅
            titleEl.textContent = formatCategoryName(currentCategory).toUpperCase() + '_';

            const filteredDocs = docs.filter(doc => doc.category === currentCategory);

            countEl.innerHTML = `[ DOCS_FOUND: <span>${filteredDocs.length}</span> ]`;

            if (filteredDocs.length === 0) {
                gridEl.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 2rem; color: var(--accent-color); margin-bottom: 1rem;">[!]</div>
                        해당 카테고리에 등록된 문서가 없습니다.<br>
                        데이터베이스를 확인해주세요.
                    </div>
                `;
                return;
            }

            gridEl.innerHTML = filteredDocs.map(post => {
                const targetPage = post.type === 'lab' ? 'lab.html' : 'index.html';
                const badge = post.type === 'lab' ? `<span class="lab-badge">LAB</span>` : '';
                const tagsHTML = (post.tags || []).map(tag => `<span class="tag">#${tag}</span>`).join('');
                
                return `
                    <div class="doc-card">
                        <div class="doc-meta">
                            <span class="doc-category-badge">${currentCategory}</span>
                            ${badge}
                        </div>
                        <a href="${targetPage}?id=${post.id}" style="text-decoration:none;">
                            <h3 class="doc-title">${post.title}</h3>
                        </a>
                        <p class="doc-desc">${post.description || '이 문서에 대한 상세 설명이 제공되지 않았습니다.'}</p>
                        <div class="doc-tags">
                            ${tagsHTML}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 초기화 로직
        document.addEventListener('DOMContentLoaded', async () => {
            // 1. 전체 데이터 로드
            const allDocs = await fetchAllDocuments();

            // 2. 문서들에서 고유한 카테고리 목록 추출 (Set 활용)
            // 데이터에 카테고리가 없는 경우를 방지하기 위해 filter(Boolean) 사용
            let uniqueCategories = [...new Set(allDocs.map(doc => doc.category).filter(Boolean))];

            // 3. 자바스크립트를 항상 최상단에 배치하기 위한 정렬 (선택 사항)
            uniqueCategories.sort((a, b) => {
                if (a === 'javascript') return -1;
                if (b === 'javascript') return 1;
                return a.localeCompare(b); // 나머지는 알파벳 순
            });

            // 4. URL 파라미터 확인 및 기본값 처리
            const urlParams = new URLSearchParams(window.location.search);
            let currentCategory = urlParams.get('category');
            
            // 만약 URL에 카테고리가 없거나, 추출한 카테고리 목록에 없는 값이라면 첫 번째 카테고리로 강제 지정
            if (!currentCategory || !uniqueCategories.includes(currentCategory)) {
                // 카테고리 데이터가 하나라도 있으면 첫 번째 값을, 없으면 'javascript'를 기본으로 설정
                currentCategory = uniqueCategories.length > 0 ? uniqueCategories[0] : 'javascript';
                window.history.replaceState({}, '', `?category=${currentCategory}`);
            }

            // 5. 화면 렌더링
            renderSidebar(uniqueCategories, currentCategory);
            renderDocs(allDocs, currentCategory);
        });
    </script>
</body>
</html>
